  addFloater(dog.x,groundY-92*DOG_S,T('mirrorOn'),'#ffffff',26);
  addFloater(dog.x,groundY-168*DOG_S,T('bothKennels')+CONFIG.invertHotMult,'#ffd94d',21);
  for(let i=0;i<22;i++) addP({kind:'spark',x:dog.x,y:groundY-40*DOG_S,vx:rand(-200,200),vy:rand(-240,-30),g:330,life:rand(0.35,0.75),max:0.75,size:rand(2,4),color:i%2?'#ffffff':'#1b1b1b'});
  SFX.deliverHot(); SFX.thunk(0);
}
/* пылесос засчитывает кость как доставку в обычную будку, пасть при этом свободна */
function vacSwallow(){
  /* combo++ ПЕРВЫМ — как в deliverBone. Иначе всосанная кость даёт на шаг
     серии меньше, чем обещает шапка: тот же рассинхрон, что чинили в доставке,
     просто в соседней функции. */
  combo++;
  score+=curDeliveryPts(); delivered++;   // всосанная — тоже чистая доставка
  /* сытость как с горячей будки ×2 (16), а не как с обычной: пылесос редкий,
     пусть кормит по-настоящему */
  hunger=Math.min(CONFIG.hungerMax,hunger+CONFIG.hungerRefill*CONFIG.hotMults[0]);
  scorePunch=1; dog.squash=1; dog.chomp=1;
  const m=mouthVis();
  for(let i=0;i<6;i++) addP({kind:'spark',x:m.x,y:m.y,vx:rand(-70,70),vy:rand(-90,10),g:300,life:rand(0.2,0.35),max:0.35,size:rand(1.5,3),color:'#e6dcff'});
  SFX.catch();
}
function deliverBone(side){
  carrying=false;
  const hot=hotAt(side);            // во время зеркала горячие обе
  const hm=curHotMult();
  /* combo++ ДО подсчёта: раньше очки брались по старой серии, а шапка уже
     показывала новую — в одном кадре «+18» над будкой и «+20 за кость» вверху
     про одну и ту же кость. Теперь обещание шапки выполняется. */
  combo++;
  const pts=curDeliveryPts();
  score+=pts; delivered++;
  if(combo>0&&combo%5===0) SFX.bark();   // серия крепнет — собака довольна
  /* ОБЕ будки дают ОДИНАКОВЫЕ очки (curDeliveryPts от серии, горячесть на них
     не влияет). Разница только в еде: обычная даёт hungerRefill, горячая
     умножает её на ×2…×4. Прежний комментарий утверждал обратное — «горячая
     даёт НИ одного очка» и «×2…×5» — и то и другое неправда, hotMults [2,3,4]. */
  const food=CONFIG.hungerRefill*(hot?hm:1);
  hunger=Math.min(CONFIG.hungerMax,hunger+food);
  scorePunch=1; dog.hop=1;   // в собственный праздник собака больше не стоит столбом
  const cx=(side===-1)?kennelLX:kennelRX;
  const m=mouthVis();
  fxBones.push({mode:'arc',t:0,dur:0.30,x0:m.x,y0:m.y,x1:cx,y1:groundY-KH*0.72,rot:0,vr:14,side:side});
  /* Раньше тут спавнились ТРИ надписи в одну точку: «+40», «×4!» и «СЫТНО».
     Они ложились друг на друга и на бейдж будки — не прочесть ни сумму, ни
     множитель. Теперь очки и множитель одной строкой, еда — следом. */
  /* Очки и множитель ЕДЫ — разные валюты, и склеенные в одну жёлтую строку
     «+18 ×4!» читались как «18 умножить на 4». Множитель теперь стоит только
     рядом с едой, где он и работает. */
  addFloater(cx,groundY-KH-(hot?74:34),'+'+pts,hot?'#ffd94d':'#f2ead8',hot?28:26);
  if(hot) addFloater(cx,groundY-KH-108,T('yum')+Math.round(food)+'  ×'+hm,'#8fe06a',22,0.18);
  deliverFlash=0.5; deliverSide=side;   // будка вспыхивает светом
  const n=hot?16:7;
  for(let i=0;i<n;i++) addP({kind:'coin',x:cx+rand(-KW*0.5,KW*0.5),y:groundY-KH*0.45,vx:rand(-140,140),vy:rand(-190,-40),g:520,life:rand(0.35,0.8),max:0.8,size:rand(2.2,4.5),color:(hot&&Math.random()<0.5)?'#ff9f2e':'#ffcf4d'});
  if(hot){
    hitStop=Math.max(hitStop,0.05); SFX.deliverHot();
    /* доставка в иксы — маленький праздник: конфетти над будкой и прыгающий множитель */
    shakeT=Math.max(shakeT,0.16); shakeAmp=Math.max(shakeAmp,3);
    const CC=['#ffd94d','#ff8a3d','#8fe06a','#7fd8ff','#ff9ae0'];
    /* фонтан по БОКАМ будки: раньше 24 конфетти и 16 монет проходили ровно
       сквозь табличку ×N и засыпали цифру — гасили единственный указатель,
       ради которого к этой будке и бежали */
    /* Будки стоят вплотную к краям поля, поэтому «по бокам» отправляло
       половину салюта за обрез: из 24 частиц было видно 12, и фонтан всегда
       бил однобоко. Зажимаем в поле. */
    for(let i=0;i<24;i++){ const sd2=(i%2)?1:-1;
      addP({kind:'spark',x:clamp(cx+sd2*rand(KW*0.55,KW*0.95),10,W-10),y:groundY-KH*0.75,vx:sd2*rand(20,150),vy:rand(-260,-80),g:430,life:rand(0.45,0.85),max:0.85,size:rand(2,4),color:CC[i%CC.length]}); }
  }
  else SFX.deliverCold();
  SFX.thunk(0.26); // стук кости о будку — когда дуга долетит
}
function poisonHit(sly){
  stunT=CONFIG.stunTime;         // реальное время
  shakeT=sly?0.25:0.34; shakeAmp=sly?7:10;
  hungerFlash=0.6;
  hitStop=Math.max(hitStop,sly?0.08:0.12);
  /* яд бьёт по сытости и дорожает со временем; ЯВНЫЙ — вдвое больнее */
  const hit=curPoisonHit()*(sly?1:CONFIG.obviousHitMult);
  hunger=Math.max(0,hunger-hit);
  if(combo>=2) addFloater(dog.x,groundY-128*DOG_S,T('streakLost'),'#c9c2b4',18);
  combo=0;                             // удар обнуляет серию чистых доставок
  addFloater(dog.x,groundY-70*DOG_S,'−'+Math.round(hit)+T('foodLost'),'#ff6b5e',sly?18:23);
  for(let i=0;i<14;i++) addP({kind:'spark',x:dog.x,y:groundY-30*DOG_S,vx:rand(-150,150),vy:rand(-220,-20),g:420,life:rand(0.3,0.6),max:0.6,size:rand(2,4),color:Math.random()<0.5?'#8fd438':'#b06fd8'});
  if(carrying){
    carrying=false; // несомая кость улетает и ТЕРЯЕТСЯ (не ловится снова)
    const m=mouthVis();   // визуальная точка: по face и с учётом подскока
    fxBones.push({mode:'tumble',x:m.x,y:m.y,vx:-dogFaceDir()*rand(160,260),vy:rand(-380,-280),rot:0,vr:rand(-11,11),life:1.3});
  }
  speedT=0; // яд снимает рывок — иначе оглушение при ускорении почти не чувствуется
  SFX.yelp();
}
function shatterBone(b){
  for(let i=0;i<6;i++) addP({kind:'puff',x:b.x+rand(-8,8),y:groundY-6,vx:rand(-30,30),vy:rand(-50,-10),g:-20,life:rand(0.3,0.6),max:0.6,size:rand(3,7),color:b.poison?'#6f9c3a':'#a99c85'});
  for(let i=0;i<4;i++) addP({kind:'shard',x:b.x,y:groundY-8,vx:rand(-90,90),vy:rand(-170,-60),g:620,life:rand(0.25,0.5),max:0.5,size:rand(2,4),color:b.poison?'#7ec832':'#e9dfc8',rot:rand(0,TAU),vrot:rand(-12,12)});
  SFX.shatter();
}

/* ---------- физика: фиксированный шаг 120 Гц ---------- */
function step(dt){
  runTime+=dt;
  /* голод */
  hunger-=curDrain()*dt;
  if(hunger<=0){ hunger=0; gameOver(); return; }
  /* горячая будка; во время зеркала горячие ОБЕ, и таймер стоит —
     иначе после зеркала будка окажется не той, которую игрок запомнил */
  if(invT<=0) hotT-=dt;
  if(hotT<=0&&invT<=0){
    /* сторона СЛУЧАЙНА (может остаться), множитель перевыбирается ВСЕГДА —
       предсказать «теперь точно с другой стороны» больше нельзя */
    if(Math.random()>=CONFIG.hotStayChance) hotSide=-hotSide;
    hotMult=rollHotMult();
    hotT+=curHotPeriod(); hotPunch=1; SFX.hotSwitch();
  }
  /* спавн костей */
  sinceEdible+=dt;
  spawnT-=dt;
  if(spawnT<=0){
    spawnT=curSpawnInterval()+rand(-CONFIG.spawnJitter,CONFIG.spawnJitter);
    const m=Math.max(40,KW*0.8); // не роняем кости прямо на будки
    /* АНТИ-ЗАСУХА: игрок не должен умирать без шанса — НАСТОЯЩАЯ еда обязана падать */
    const forceFood=sinceEdible>CONFIG.edibleGuarantee;
    /* ОДИН розыгрыш на все особые кости — доли честные, от ВСЕХ костей.
       Волшебная кормит, поэтому засуха её не отменяет; три прикола — отменяет. */
    let special=null;
    { const r0=Math.random(); let a=curMagicChance();
      if(r0<a) special='magic';
      else if(!forceFood){
        a+=curAuraChance();   if(r0<a) special='aura';
        else { a+=curVacChance(); if(r0<a) special='vac';
        else { a+=curInvertChance(); if(r0<a) special='invert'; } }
      } }
    const magic=(special==='magic');
    let poison=!special&&Math.random()<curPoisonRatio();
    if(forceFood) poison=false;
    if(poisonStreak>=2) poison=false;      // не больше двух ядовитых подряд
    let kind=special||'norm', sly=false;
    if(poison){
      poisonStreak++;
      sly=Math.random()<curSneakShare();   // замаскированная — почти как обычная
    }else{
      poisonStreak=0;
      if(!special){
        const r=Math.random(), sp=curSpeedChance(), sl=curSlowChance();
        if(!forceFood&&r<sp) kind='speed';           // рывок и камень НЕ считаются едой,
        else if(!forceFood&&r<sp+sl) kind='slow';    // при засухе их не подсовываем
      }
      if(kind==='norm'||kind==='magic') sinceEdible=0;
    }
    /* РАЗВОДИМ ТРАЕКТОРИИ. Плохая кость не должна падать вплотную по следу
       хорошей: тогда поймать еду и увернуться физически невозможно, и это
       читается как несправедливость. Требуем зазор по горизонтали между
       хорошей и плохой, пока обе в верхней части экрана — уворот остаётся
       обязательным, но выполнимым. */
    const bad=poison||kind==='slow';
    let bx=rand(m,W-m), bestGap=-1;
    for(let a=0;a<10;a++){
      const cand=(a===0)?bx:rand(m,W-m);
      let gap=1e9;
      for(const o of bones){
        if(o.dead||o.y>groundY*CONFIG.sepBandFrac) continue;   // нижние уже не мешают
        const oBad=o.poison||o.kind==='slow';
        if(oBad===bad) continue;                               // важен только конфликт «еда ↔ опасность»
        gap=Math.min(gap,Math.abs(cand-o.x));
      }
      if(gap>bestGap){ bestGap=gap; bx=cand; }
      if(gap>=CONFIG.minSepX) break;                           // зазора достаточно
    }
    bones.push({x:bx,y:-26,rot:rand(0,TAU),vr:rand(-2.5,2.5),poison:poison,sly:sly,kind:kind,wob:rand(0,TAU),dead:false});
  }
  /* собака */
  const stunned=stunT>0;
  const boosted=speedT>0, heavy=slowT>0; // ⚡ рывок / 🪨 тяжесть
  let capBase=carrying?(boosted?CONFIG.dogSpeedEmpty:CONFIG.dogSpeedCarry):CONFIG.dogSpeedEmpty*(boosted?1.15:1);
  if(heavy) capBase*=CONFIG.slowFactor;
  const cap=capBase*W*dt;
  if(!stunned){
    /* держишь кнопку/клавишу — бежит; отпустил — стоп. Клавиатура главнее пульта. */
    let dir=0;
    if(keyL!==keyR) dir=keyR?1:-1;
    else dir=padDir;
    if(invT>0) dir=-dir;      // ⇄ зеркало: кнопка ведёт в противоположную сторону
    const mv=dir*cap;
    if(mv!==0){
      dog.x=clamp(dog.x+mv,26,W-26);
      if(Math.abs(mv)>cap*0.12) dog.dir=mv>0?1:-1;
      dog.step+=Math.abs(mv);
      /* топаем каждые ~30 единиц пути: лапа коснулась земли */
      /* 105 вместо 30: при 30 шаг щёлкал 18 раз в секунду — это не бег, а
         дребезг. Теперь ~5 в секунду, как у настоящей собачьей рыси. */
      if(dog.step-lastPaw>105*DOG_S){ lastPaw=dog.step; SFX.paw(); }
      dog.vx=mv/dt;
    } else dog.vx=0;
  } else dog.vx=0;
  /* РАЗВОРОТ не мгновенный. Раньше спрайт зеркалился за один кадр и смена
     направления читалась как телепорт — а это главное действие игрока.
     Теперь собака «складывается» через ноль за ~0.1с и топает пылью. */
  if(dog.face!==dog.dir){
    /* РАВНОМЕРНО, а не экспонентой. У экспоненты бесконечный хвост: доворот
       занимал 0.275с вместо обещанных 0.1, и при частых перекладках собака
       вообще не успевала выйти на полную ширину — жила узким блином.
       Скорость 20/с = полный разворот с −1 до 1 ровно за 0.1с, всегда. */
    const was=dog.face, d=dog.dir-dog.face;
    dog.face+=Math.sign(d)*Math.min(20*dt,Math.abs(d));
    if(was*dog.face<0) for(let i=0;i<4;i++)
      addP({kind:'puff',x:dog.x+rand(-9,9),y:groundY-rand(2,9)*DOG_S,vx:rand(-32,32),vy:rand(-22,-4),g:40,life:rand(0.2,0.4),max:0.4,size:rand(2,4.5),color:'#a08a6a'});
  }
  /* ⚡ следы скорости за собакой / 🪨 пыль тяжести */
  if(speedT>0&&Math.random()<dt*26){ const fd2=dogFaceDir();
    addP({kind:'spark',x:dog.x-fd2*rand(14,30),y:groundY-dogLift()-rand(10,34)*DOG_S,vx:-fd2*rand(50,110),vy:rand(-20,20),g:0,life:0.35,max:0.35,size:rand(1.5,3),color:'#ffd94d'}); }
  if(slowT>0&&Math.random()<dt*12) addP({kind:'puff',x:dog.x+rand(-16,16),y:groundY-rand(2,10)*DOG_S,vx:rand(-20,20),vy:rand(-24,-6),g:30,life:0.5,max:0.5,size:rand(2.5,5),color:'#9aa3b0'});
  /* доставка: засчитываем, как только КОНЧИК несомой кости коснулся тёмного входа */
  if(carrying&&!stunned){
    const doorHalf=KW*0.22;          // половина ширины чёрного проёма
    const reach=42*DOG_S;            // от центра собаки до кончика кости в зубах
    if(dog.x-reach<=kennelLX+doorHalf) deliverBone(-1);
    else if(dog.x+reach>=kennelRX-doorHalf) deliverBone(1);
  }
  /* кости */
  const fall=curFall();
  let anyDead=false;
  for(let i=0;i<bones.length;i++){
    const b=bones[i];
    /* яд и камни разгоняются со временем, обычные кости — нет */
    const badMult=(b.poison||b.kind==='slow')?curBadFall():1;
    b.y+=fall*(b.kind==='slow'?CONFIG.stoneFallMult:1)*badMult*dt;
    b.rot+=b.vr*dt;
    if(b.poison){
      b.wob+=dt*7;
      b.x+=Math.sin(b.wob)*10*dt; // ядовитая слегка виляет — примета для ОБОИХ видов
      if(b.sly){ // замаскированная: капля пореже и потусклее явной — подсказка есть, но искать надо
        if(Math.random()<dt*4.2) addP({kind:'drip',x:b.x+rand(-4,4),y:b.y+8,vx:0,vy:40,g:180,life:0.5,max:0.5,size:rand(2,3),color:'#a8c24a'});
      }else{
        if(Math.random()<dt*10) addP({kind:'drip',x:b.x+rand(-4,4),y:b.y+8,vx:0,vy:40,g:180,life:0.5,max:0.5,size:rand(2,3.5),color:'#8fd438'});
        if(Math.random()<dt*6)  addP({kind:'bubble',x:b.x+rand(-8,8),y:b.y+rand(-6,6),vx:rand(-6,6),vy:-30,g:-40,life:0.7,max:0.7,size:rand(2,4),color:'#c17fe8'});
      }
    }else if(b.kind==='speed'&&Math.random()<dt*9){ // ⚡ золотые искорки
      addP({kind:'spark',x:b.x+rand(-8,8),y:b.y+rand(-6,6),vx:rand(-14,14),vy:rand(-10,26),g:60,life:0.45,max:0.45,size:rand(1.5,3),color:'#ffd94d'});
    }else if(b.kind==='magic'&&Math.random()<dt*16){ // радужный шлейф — видно через весь экран
      const cols=['#ff9ae0','#9ae0ff','#ffe98a','#b8ff9a'];
      addP({kind:'spark',x:b.x+rand(-11,11),y:b.y+rand(-9,9),vx:rand(-18,18),vy:rand(-16,24),g:30,life:0.55,max:0.55,size:rand(2,4),color:cols[(Math.random()*4)|0]});
    }else if(b.kind==='aura'&&Math.random()<dt*13){
      addP({kind:'spark',x:b.x+rand(-10,10),y:b.y+rand(-8,8),vx:rand(-14,14),vy:rand(-14,20),g:25,life:0.5,max:0.5,size:rand(2,3.5),color:Math.random()<0.5?'#7fd8ff':'#e8faff'});
    }else if(b.kind==='vac'&&Math.random()<dt*13){
      addP({kind:'spark',x:b.x+rand(-10,10),y:b.y+rand(-8,8),vx:rand(-14,14),vy:rand(-14,20),g:25,life:0.5,max:0.5,size:rand(2,3.5),color:Math.random()<0.5?'#b98cff':'#e6dcff'});
    }else if(b.kind==='invert'&&Math.random()<dt*13){
      addP({kind:'spark',x:b.x+rand(-10,10),y:b.y+rand(-8,8),vx:rand(-14,14),vy:rand(-14,20),g:25,life:0.5,max:0.5,size:rand(2,3.5),color:Math.random()<0.5?'#ffffff':'#2a2a2a'});
    }else if(b.kind==='slow'&&Math.random()<dt*5){ // каменная пыль — тяжесть видно издалека
      addP({kind:'puff',x:b.x+rand(-6,6),y:b.y+8,vx:rand(-8,8),vy:rand(10,30),g:40,life:0.4,max:0.4,size:rand(2,3.5),color:'#9aa3b0'});
    }
    /* 🌀 пылесос: съедобное из НИЖНЕЙ половины экрана летит в пасть и
       засчитывается как доставка в обычную будку (очки + еда, пасть свободна) */
    if(vacT>0&&!b.dead&&isEdible(b)&&b.y>PLAY_H*0.5){
      const m=mouthPos(), dx=m.x-b.x, dy=m.y-b.y, d=Math.hypot(dx,dy)||1;
      const step=CONFIG.vacPullSpeed*dt;
      if(d<=step+18){ b.dead=true; anyDead=true; vacSwallow(); continue; }
      b.x+=dx/d*step; b.y+=dy/d*step; b.rot+=dt*12;
      if(Math.random()<dt*20) addP({kind:'spark',x:b.x,y:b.y,vx:rand(-20,20),vy:rand(-20,20),g:0,life:0.3,max:0.3,size:rand(1.5,3),color:'#b98cff'});
      continue;
    }
    /* касание собаки: ловим ТОЛЬКО в воздухе, в полосе над землёй */
    if(!stunned&&!b.dead&&b.y>groundY-CONFIG.catchBandH&&b.y<groundY-2&&Math.abs(b.x-dog.x)<CONFIG.catchRadius){
      if(b.kind==='speed'){ b.dead=true; anyDead=true; speedPickup(); continue; } // съедается на лету, пасть не занимает
      if(b.kind==='slow'){ b.dead=true; anyDead=true; slowPickup(); continue; }   // камень тоже срабатывает от касания
      if(b.kind==='magic'){ b.dead=true; anyDead=true; magicPickup(); continue; } // волшебную достаточно поймать
      if(b.kind==='aura'){ b.dead=true; anyDead=true; auraPickup(); continue; }
      if(b.kind==='vac'){ b.dead=true; anyDead=true; vacPickup(); continue; }
      if(b.kind==='invert'){ b.dead=true; anyDead=true; invertPickup(); continue; }
      if(isHarmful(b)){                       // с учётом инверсии: во время неё вредны ОБЫЧНЫЕ
        b.dead=true; anyDead=true;
        if(auraT>0){ auraBlock(b); } else { poisonHit(b.sly); }
        continue;
      }
      if(!carrying){ b.dead=true; anyDead=true; catchBone(b); continue; }
      /* с костью в зубах съедобные кости игнорируются — пролетают мимо */
    }
    /* земля: кость разбивается и исчезает навсегда */
    if(!b.dead&&b.y>=groundY-7){ b.dead=true; anyDead=true; shatterBone(b); }
  }
  if(anyDead) bones=bones.filter(function(b){ return !b.dead; });
}

/* ---------- косметика (частицы/текст/летящие кости) ---------- */
function updateFx(dt){
  for(let i=particles.length-1;i>=0;i--){
    const p=particles[i];
    p.life-=dt;
    if(p.life<=0){ particles.splice(i,1); continue; }
    p.vy+=(p.g||0)*dt; p.x+=p.vx*dt; p.y+=p.vy*dt;
    if(p.vrot) p.rot+=p.vrot*dt;
  }
  for(let i=floaters.length-1;i>=0;i--){
    const f=floaters[i];
    if(f.delay>0){ f.delay-=dt; continue; }   // ещё не вышла: не живёт и не рисуется
    f.life-=dt; f.y-=46*dt;
    if(f.life<=0) floaters.splice(i,1);
  }
  for(let i=fxBones.length-1;i>=0;i--){
    const b=fxBones[i];
    if(b.mode==='arc'){
      b.t+=dt; b.rot+=b.vr*dt;
      if(b.t>=b.dur){
        kennelSquash[String(b.side)]=1; // будка подпрыгивает, когда кость долетела
        for(let k=0;k<6;k++) addP({kind:'puff',x:b.x1+rand(-10,10),y:b.y1,vx:rand(-25,25),vy:rand(-40,-5),g:-15,life:rand(0.2,0.45),max:0.45,size:rand(3,6),color:'#c9b89a'});
        fxBones.splice(i,1);
      }
    }else{
      b.vy+=1500*dt; b.x+=b.vx*dt; b.y+=b.vy*dt; b.rot+=b.vr*dt; b.life-=dt;
      if(b.y>groundY-8&&b.vy>0){ b.y=groundY-8; b.vy*=-0.45; b.vx*=0.65; }
      if(b.life<=0) fxBones.splice(i,1);
    }
  }
}

/* ---------- главный цикл ---------- */
function frame(now){
  requestAnimationFrame(frame);
  let rdt=(now-last)/1000; last=now;
  if(!isFinite(rdt)||rdt<0) rdt=0.016;
  if(rdt>0.05) rdt=0.05;           // защита от гигантского dt (фон, отладчик)
  realTime+=rdt;   // UI дышит всегда: мигание, пульсация кнопок
  /* НА ПАУЗЕ игровое время стоит. Таймеры приколов, оглушение, тряска —
     всё считается от gdt, поэтому на паузе они замирают, а не сгорают. */
  const gdt=(state==='pause')?0:rdt;
  /* dpr или размер окна могли смениться между событиями resize */
  const dprNow=clamp(window.devicePixelRatio||1,1,3);
  if(RW!==window.innerWidth||RH!==window.innerHeight||canvas.width!==Math.round(window.innerWidth*dprNow)) resize();
  /* таймеры РЕАЛЬНОГО времени: hit-stop не может заклинить игру */
  if(hitStop>0){ hitStop-=gdt; timeScale=0.12; } else timeScale=1;
  if(stunT>0) stunT-=gdt;
  if(speedT>0) speedT-=gdt;
  if(slowT>0) slowT-=gdt;
  updateSky(rdt);
  updateAmbience();
  if(auraT>0) auraT-=gdt;
  if(vacT>0){
    vacT-=gdt;
    if(vacHum&&muted) vacHumStop();
    else if(!vacHum&&!muted&&AC) vacHumStart();
    if(vacHum) vacHum.o.frequency.value=92+Math.sin(realTime*24)*6;   // урчит
    if(Math.random()<0.6&&state==='play'){ const mv=mouthVis(), fd=dogFaceDir();
      addP({kind:'spark',x:mv.x+fd*rand(16,40)*DOG_S,y:mv.y-rand(0,20)*DOG_S,vx:-fd*130,vy:10,g:0,life:0.22,max:0.22,size:rand(1.5,2.6),color:'#b98cff'}); }
    if(vacT<=0) vacHumStop();
  } else if(vacHum) vacHumStop();
  if(state==='pause'&&vacHum) vacHumStop();
  if(invT>0){ invT-=gdt; if(invT<=0) invertEnded(); }
  if(invEndT>0) invEndT-=gdt;
  if(shakeT>0) shakeT-=gdt;
  if(hungerFlash>0) hungerFlash-=gdt;
  if(deliverFlash>0) deliverFlash-=gdt;
  if(overDelay>0) overDelay-=gdt;
  scorePunch=Math.max(0,scorePunch-rdt*3);
  hotPunch=Math.max(0,hotPunch-rdt*2.5);
  kennelSquash['-1']=Math.max(0,kennelSquash['-1']-rdt*4);
  kennelSquash['1']=Math.max(0,kennelSquash['1']-rdt*4);
  dog.squash=Math.max(0,dog.squash-rdt*4);
  dog.chomp=Math.max(0,dog.chomp-gdt*4.5);   // щелчок пасти
  dog.hop=Math.max(0,dog.hop-gdt*3);         // подскок радости
  /* физика с аккумулятором */
  if(state==='play'){
    acc+=rdt*timeScale;
    if(acc>0.2) acc=0.2;
    const SUB=1/120;
    while(acc>=SUB&&state==='play'){ step(SUB); acc-=SUB; }
  }
  updateFx(gdt*timeScale); // косметика доигрывает и на экране смерти
  render();
}

/* ---------- отрисовка ---------- */
const FONT='system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif';
function txt(s,x,y,size,color,align,weight,alpha){
  ctx.globalAlpha=(alpha===undefined)?1:alpha;
  ctx.fillStyle=color;
  const wg=weight||'bold', al=align||'center';
  let px=Math.round(size);
  ctx.font=wg+' '+px+'px '+FONT;
  ctx.textAlign=al;
  ctx.textBaseline='middle';
  /* АВТОПОДГОНКА. Английские фразы длиннее русских на четверть, и без этого
     «CONTROLS MIRRORED · BOTH KENNELS ×4» уезжает за край поля. Раньше такое
     уже ловили руками («КАК ОБЫЧНО!» не влезал) — теперь ловится само,
     и для любого следующего языка тоже. Короткие строки не меряем. */
  if(typeof s==='string'&&s.length>6){
    const budget=(al==='center')?(W-24):(al==='left'?(W-x-12):(x-12));
    if(budget>20){
      const mw=ctx.measureText(s).width;
      if(mw>budget){ px=Math.max(8,Math.floor(px*budget/mw)); ctx.font=wg+' '+px+'px '+FONT; }
    }
  }
  ctx.fillText(s,x,y);
  ctx.globalAlpha=1;
}
function rr(x,y,w,h,r){
  const q=Math.min(r,w/2,h/2);
  ctx.beginPath();
  ctx.moveTo(x+q,y);
  ctx.arcTo(x+w,y,x+w,y+h,q);
  ctx.arcTo(x+w,y+h,x,y+h,q);
  ctx.arcTo(x,y+h,x,y,q);
  ctx.arcTo(x,y,x+w,y,q);
  ctx.closePath();
}
function drawStar(x,y,r,color,rot){
  ctx.save(); ctx.translate(x,y); ctx.rotate(rot||0);
  ctx.fillStyle=color;
  ctx.beginPath();
  for(let i=0;i<8;i++){
    const rr2=(i%2===0)?r:r*0.42;
    const a=i/8*TAU;
    ctx.lineTo(Math.cos(a)*rr2,Math.sin(a)*rr2);
  }
  ctx.closePath(); ctx.fill(); ctx.restore();
}
/* ---- особые предметы: не перекрашенные кости, а вещи ---- */
function drawShieldItem(x,y,r){
  ctx.save(); ctx.translate(x,y);
  ctx.shadowColor='#7fd8ff'; ctx.shadowBlur=14;
  ctx.beginPath();
  ctx.moveTo(0,-r*0.9);
  ctx.quadraticCurveTo(r*0.85,-r*0.62,r*0.72,-r*0.02);
  ctx.quadraticCurveTo(r*0.6,r*0.66,0,r*0.98);
  ctx.quadraticCurveTo(-r*0.6,r*0.66,-r*0.72,-r*0.02);
  ctx.quadraticCurveTo(-r*0.85,-r*0.62,0,-r*0.9);
  ctx.closePath();
  ctx.fillStyle='#3f8fc0'; ctx.fill();
  ctx.shadowBlur=0;
  ctx.strokeStyle='#eafaff'; ctx.lineWidth=2.4; ctx.stroke();
  /* мини-косточка на гербе: вот что защищаем */
  ctx.fillStyle='#eafaff';
  rr(-r*0.34,-r*0.10,r*0.68,r*0.2,r*0.1); ctx.fill();
  for(const e of [-1,1]) for(const k of [-1,1]){
    ctx.beginPath(); ctx.arc(e*r*0.34,k*r*0.13,r*0.14,0,TAU); ctx.fill();
  }
  ctx.restore();
}
function drawVacItem(x,y,r){
  ctx.save(); ctx.translate(x,y);
  ctx.shadowColor='#b98cff'; ctx.shadowBlur=14;
  ctx.fillStyle='#8f5fe8';
  rr(-r*0.75,-r*0.55,r*1.5,r*1.1,r*0.3); ctx.fill();
  ctx.shadowBlur=0;
  ctx.fillStyle='#b98cff';
  rr(-r*0.75,-r*0.55,r*1.5,r*0.4,r*0.24); ctx.fill();
  ctx.strokeStyle='#4c2a8f'; ctx.lineWidth=2;
  rr(-r*0.75,-r*0.55,r*1.5,r*1.1,r*0.3); ctx.stroke();
  ctx.fillStyle='#2a175c';
  ctx.beginPath(); ctx.arc(-r*0.42,r*0.66,r*0.16,0,TAU); ctx.fill();
  ctx.beginPath(); ctx.arc(r*0.42,r*0.66,r*0.16,0,TAU); ctx.fill();
  /* шланг с соплом */
  ctx.strokeStyle='#4c2a8f'; ctx.lineWidth=r*0.18; ctx.lineCap='round';
  ctx.beginPath(); ctx.moveTo(r*0.55,-r*0.4);
  ctx.quadraticCurveTo(r*1.25,-r*0.75,r*1.05,-r*1.2);
  ctx.stroke();
  ctx.fillStyle='#2a175c';
  rr(r*0.86,-r*1.5,r*0.4,r*0.34,r*0.08); ctx.fill();
  /* чёрточки всасывания */
  ctx.strokeStyle='rgba(230,220,255,0.9)'; ctx.lineWidth=1.5; ctx.lineCap='round';
  for(let i=-1;i<=1;i++){
    ctx.beginPath();
    ctx.moveTo(r*(1.06+i*0.14),-r*1.86);
    ctx.lineTo(r*(1.06+i*0.10),-r*1.58);
    ctx.stroke();
  }
  ctx.restore();
}
function drawInvertItem(x,y,r){
  ctx.save(); ctx.translate(x,y);
  ctx.shadowColor='#ffffff'; ctx.shadowBlur=12;
  ctx.beginPath(); ctx.arc(0,0,r*0.82,0,TAU);
  ctx.fillStyle='#f2f2f2'; ctx.fill();
  ctx.shadowBlur=0;
  ctx.beginPath(); ctx.moveTo(0,-r*0.82); ctx.arc(0,0,r*0.82,-Math.PI/2,Math.PI/2); ctx.closePath();
  ctx.fillStyle='#1b1b1b'; ctx.fill();
  ctx.strokeStyle='#000'; ctx.lineWidth=2;
  ctx.beginPath(); ctx.arc(0,0,r*0.82,0,TAU); ctx.stroke();
  /* встречные стрелки, каждая контрастна своей половине */
  ctx.fillStyle='#1b1b1b';
  ctx.beginPath(); ctx.moveTo(-r*0.58,-r*0.24); ctx.lineTo(-r*0.14,-r*0.5); ctx.lineTo(-r*0.14,r*0.02); ctx.closePath(); ctx.fill();
  ctx.fillStyle='#f2f2f2';
  ctx.beginPath(); ctx.moveTo(r*0.58,r*0.24); ctx.lineTo(r*0.14,r*0.5); ctx.lineTo(r*0.14,-r*0.02); ctx.closePath(); ctx.fill();
  ctx.restore();
}
function drawBone(x,y,rot,r,poison,kind,sly){
  if(kind==='aura'){ drawShieldItem(x,y,r); return; }
  if(kind==='vac'){ drawVacItem(x,y,r); return; }
  if(kind==='invert'){ drawInvertItem(x,y,r); return; }
  ctx.save(); ctx.translate(x,y); ctx.rotate(rot);
  const shaftW=r*0.52, lr=r*0.46;
  const speed=(kind==='speed'), stone=(kind==='slow'), magic=(kind==='magic');
  /* ДВА ЯДА, оба видно ИЗДАЛЕКА, но перепутать нельзя:
     тухлая — болотно-бурая с мухой, бьёт обычно;
     ядовитая — ярко-зелёная с фиолетовыми шишками и черепом, бьёт вдвое. */
  /* железная кость — металл вместо камня; волшебная — переливающаяся радуга */
  /* Обводка обычной кости ТЁМНАЯ: кремовая кость пролетает по кремовому месяцу
     и без неё просто исчезает — а месяц висит ровно там, где кости спавнятся.
     Железная затемнена до холодной стали: раньше она была того же тона, что
     съедобная, и её хватали по ошибке — это промах графики, а не игрока. */
  const body=poison?(sly?'#8f9a3c':'#7ec832'):(magic?'#ffffff':(speed?'#ffd94d':(stone?'#8b93a0':'#f4ecd8')));
  const lobe=poison?(sly?'#a6a558':'#a05fd0'):(magic?'#ffd9f4':(speed?'#ffe98a':(stone?'#98a0ad':'#f4ecd8')));   // шишки СВЕТЛЕЕ стержня, как у всех остальных
  const line=poison?(sly?'#5d6524':'#3f7d1e'):(magic?'#c96fb4':(speed?'#c8931e':(stone?'#3f4653':'#7a6848')));
  if(magic){ ctx.shadowColor='hsl('+Math.round((realTime*140)%360)+',95%,70%)'; ctx.shadowBlur=16; }
  if(speed){ ctx.shadowColor='#ffd94d'; ctx.shadowBlur=10; }
  ctx.lineWidth=2.4; ctx.strokeStyle=line;
  ctx.fillStyle=body;
  rr(-r,-shaftW/2,2*r,shaftW,shaftW/2); ctx.fill(); ctx.stroke();
  ctx.fillStyle=lobe;
  for(let e=-1;e<=1;e+=2){
    for(let k=-1;k<=1;k+=2){
      if(magic) ctx.fillStyle='hsl('+Math.round((realTime*140+(e+1)*90+(k+1)*45)%360)+',90%,78%)'; // радуга
      ctx.beginPath(); ctx.arc(e*r,k*lr*0.62,lr,0,TAU); ctx.fill(); ctx.stroke();
    }
  }
  if(poison&&!sly){ // ЯДОВИТАЯ — череп, всегда вертикально, читается мгновенно
    ctx.rotate(-rot);
    ctx.fillStyle='#f2f2f2';
    ctx.beginPath(); ctx.arc(0,-1,r*0.34,0,TAU); ctx.fill();
    ctx.fillRect(-r*0.20,r*0.03,r*0.40,r*0.22);
    ctx.fillStyle='#1e1e1e';
    ctx.beginPath(); ctx.arc(-r*0.13,-r*0.07,r*0.09,0,TAU); ctx.fill();
    ctx.beginPath(); ctx.arc(r*0.13,-r*0.07,r*0.09,0,TAU); ctx.fill();
  }
  if(poison&&sly){ // ТУХЛАЯ — своя примета: муха над костью, тоже строго вертикально
    ctx.rotate(-rot);
    ctx.fillStyle='#2b2b1c';
    ctx.beginPath(); ctx.ellipse(0,-r*0.06,r*0.16,r*0.11,0,0,TAU); ctx.fill();
    ctx.fillStyle='rgba(230,240,200,0.85)';
    ctx.beginPath(); ctx.ellipse(-r*0.17,-r*0.20,r*0.15,r*0.08,-0.6,0,TAU); ctx.fill();
    ctx.beginPath(); ctx.ellipse(r*0.17,-r*0.20,r*0.15,r*0.08,0.6,0,TAU); ctx.fill();
    /* пятна гнили на самой кости */
    ctx.fillStyle='rgba(60,70,20,0.55)';
    ctx.beginPath(); ctx.arc(-r*0.45,r*0.06,r*0.13,0,TAU); ctx.fill();
    ctx.beginPath(); ctx.arc(r*0.40,-r*0.10,r*0.10,0,TAU); ctx.fill();
  }
  if(speed){ // молния всегда вертикально, как черепок у яда
    ctx.rotate(-rot);
    ctx.fillStyle='#fffbe8'; ctx.strokeStyle='#c8931e'; ctx.lineWidth=1.4;
    ctx.beginPath();
    ctx.moveTo(-r*0.10,-r*0.42); ctx.lineTo(r*0.16,-r*0.42); ctx.lineTo(r*0.02,-r*0.06);
    ctx.lineTo(r*0.18,-r*0.06); ctx.lineTo(-r*0.12,r*0.44); ctx.lineTo(-r*0.02,r*0.04);
    ctx.lineTo(-r*0.18,r*0.04); ctx.closePath(); ctx.fill(); ctx.stroke();
  }
  if(magic){ // ЗВЁЗДОЧКА — всегда вертикально, как череп у яда
    ctx.shadowBlur=0;
    ctx.rotate(-rot);
    ctx.fillStyle='#fffdf5'; ctx.strokeStyle='#c96fb4'; ctx.lineWidth=1.3;
    ctx.beginPath();
    for(let i=0;i<10;i++){
      const a=-Math.PI/2+i*Math.PI/5, rad=(i%2===0)?r*0.46:r*0.19;
      const px=Math.cos(a)*rad, py=Math.sin(a)*rad;
      if(i===0) ctx.moveTo(px,py); else ctx.lineTo(px,py);
    }
    ctx.closePath(); ctx.fill(); ctx.stroke();
  }
  if(stone){ // ЖЕЛЕЗНАЯ: блик, заклёпки и гравировка веса
    /* блик рисуем ДО поворота — он должен лежать вдоль стержня, а не по экрану */
    ctx.fillStyle='rgba(255,255,255,0.20)';
    rr(-r*0.62,-shaftW*0.30,r*1.24,shaftW*0.20,shaftW*0.10); ctx.fill();
    ctx.rotate(-rot);
    ctx.fillStyle='#333944';
    for(const e of [-1,1]) for(const k of [-1,1]){
      ctx.beginPath(); ctx.arc(e*r*0.62,k*r*0.30,r*0.10,0,TAU); ctx.fill();
    }
    /* Гравировка убрана совсем. Порог r>=12 не спас: справка рисует кость
       с r=13, кегль выходит 5.7px на четыре глифа, а свободный участок стержня
       между шишками ~14px — надпись обрезалась заклёпками даже там. Железо
       читается холодным тоном, бликом и заклёпками; подпись только мешала. */
  }
  ctx.restore();
}
function drawGround(){
  const gh=PLAY_H-groundY;
  /* земля с градиентом: у горизонта светлее, к низу уходит в тень */
  const gg=ctx.createLinearGradient(0,groundY,0,PLAY_H);
  gg.addColorStop(0,'#3a2b21'); gg.addColorStop(0.45,'#2b1f18'); gg.addColorStop(1,'#1c1410');
  /* запас по краям: двор уезжает под translate(ox,oy) на тряске до 14 единиц,
     и без запаса вдоль низа и боков вспыхивала полоса ночного неба */
  ctx.fillStyle=gg; ctx.fillRect(-20,groundY,W+40,gh+20);
  /* кромка: тёплая полоса и трава силуэтом */
  ctx.fillStyle='#4a3527'; ctx.fillRect(-20,groundY,W+40,5);
  /* Земля едет со СВОИМ, слабым параллаксом. Раньше трава переднего плана
     плыла на 0.34, а лужи, камешки и эти травинки стояли намертво — в одном
     сантиметре кадра три системы одной земли с параллаксом 0.34, 0 и 0.
     Теперь глубина нарастает: город 0.045…0.19, земля 0.10, трава 0.34. */
  const gdx=-(dog.x-W/2)*0.10;
  ctx.strokeStyle='#2c3a22'; ctx.lineWidth=1.6;
  for(let i=0;i<46;i++){
    const gx=((i*97.31+13)%1000)/1000*W+gdx, lean=Math.sin(realTime*0.8+i)*1.6, hgt=3+((i*41.7)%5);
    ctx.beginPath(); ctx.moveTo(gx,groundY+3); ctx.lineTo(gx+lean,groundY+3-hgt); ctx.stroke();
  }
  /* ЛУЖИ: отражают луну и свет будок — самая дешёвая «дорогая» деталь */
  for(let i=0;i<3;i++){
    const px=W*(0.18+i*0.31)+Math.sin(i*2.1)*10+gdx, py=groundY+gh*(0.42+0.18*((i*7)%3)/2);
    const pw=W*(0.10+0.045*((i*5)%3)), ph=Math.max(3,gh*0.11);
    const pg=ctx.createLinearGradient(0,py-ph,0,py+ph);
    pg.addColorStop(0,'rgba(150,175,225,0.42)'); pg.addColorStop(1,'rgba(70,82,130,0.20)');
    ctx.fillStyle=pg;
    ctx.beginPath(); ctx.ellipse(px,py,pw,ph,0,0,TAU); ctx.fill();
    /* три одинаковых овала с равным шагом читались как копипаста —
       двум добавляем прилипший «отросток», форма у каждой своя */
    if(i===1){ ctx.beginPath(); ctx.ellipse(px+pw*0.78,py+ph*0.38,pw*0.52,ph*0.68,0,0,TAU); ctx.fill(); }
    if(i===2){ ctx.beginPath(); ctx.ellipse(px-pw*0.88,py-ph*0.22,pw*0.42,ph*0.52,0,0,TAU); ctx.fill(); }
    /* круги от капель: расходятся от центра и гаснут к краю лужи.
       t — фаза 0..1, ph — полувысота самой лужи (не затенять!) */
    for(let k=0;k<2;k++){
      const t=(realTime*0.9+i*0.37+k*0.5)%1;
      ctx.strokeStyle='rgba(210,224,255,'+(0.26*(1-t)).toFixed(3)+')';
      ctx.lineWidth=1;
      ctx.beginPath();
      ctx.ellipse(px+Math.sin(i*3+k*2)*pw*0.35,py,pw*0.6*t,ph*0.85*t,0,0,TAU);
      ctx.stroke();
    }
    /* дрожащий блик — как отражение в воде */
    ctx.fillStyle='rgba(247,238,203,'+(0.22+0.08*Math.sin(realTime*2+i)).toFixed(3)+')';
    ctx.beginPath(); ctx.ellipse(px+Math.sin(realTime*1.4+i)*2,py,pw*0.30,ph*0.34,0,0,TAU); ctx.fill();
    /* тёплое отражение фонаря горячей будки: раньше её свет висел в воздухе
       и земли не касался вовсе */
    /* во время зеркала горячие ОБЕ будки — отражений тоже два, иначе сцена
       не кричит «обе», хотя оба фонаря горят на полную */
    for(const sd of (invT>0?[-1,1]:[hotSide])){
      const hkx=(sd===-1)?kennelLX:kennelRX, dh=Math.abs(px-hkx);
      if(dh>=W*0.30) continue;
      const kk=1-dh/(W*0.30);
      ctx.fillStyle='rgba(255,203,108,'+(0.17*kk).toFixed(3)+')';
      ctx.beginPath(); ctx.ellipse(px+(hkx-px)*0.28,py,pw*0.20,ph*0.80,0,0,TAU); ctx.fill();
    }
  }
  /* камешки */
  ctx.fillStyle='rgba(0,0,0,0.18)';
  for(let i=0;i<16;i++){
    const px=((i*211.7+37)%1000)/1000*W+gdx;
    const py=groundY+14+((i*53.3+11)%1000)/1000*Math.max(8,gh-24);
    ctx.beginPath(); ctx.ellipse(px,py,3.2,1.8,0,0,TAU); ctx.fill();
  }
  ctx.fillStyle='rgba(255,255,255,0.05)';
  for(let i=0;i<10;i++){
    const px=((i*167.3+61)%1000)/1000*W+gdx;
    const py=groundY+16+((i*73.9+29)%1000)/1000*Math.max(8,gh-26);
    ctx.fillRect(px,py,2,1.5);
  }
}
/* ---- ТЕНИ. Это механика, а не косметика: растущая тень — единственный
   способ видеть, КУДА упадёт кость, не провожая её глазами. Альфа растёт
   квадратично, чтобы десяток теней высоко в небе не превращался в мусор:
   тень заметна только у тех костей, которые вот-вот приземлятся. ---- */
/* Волшебная кость гоняет hue по кругу; её ореол должен гоняться вместе с ней.
   Считаем rgb вручную — createRadialGradient не принимает hsl в старых WebKit. */
function magicRGB(){
  const h=((realTime*140)%360)/60, x=1-Math.abs(h%2-1);
  let r,g2,b2;
  if(h<1){r=1;g2=x;b2=0;} else if(h<2){r=x;g2=1;b2=0;} else if(h<3){r=0;g2=1;b2=x;}
  else if(h<4){r=0;g2=x;b2=1;} else if(h<5){r=x;g2=0;b2=1;} else {r=1;g2=0;b2=x;}
  const lo=0.49, hi=0.95;   // светлый насыщенный, как само тело кости
  return Math.round(255*(lo+r*(hi-lo)))+','+Math.round(255*(lo+g2*(hi-lo)))+','+Math.round(255*(lo+b2*(hi-lo)));
}
function drawShadows(){
  /* ПОРЯДОК КРИТИЧЕН: сначала цветное пятно, ПОВЕРХ — чёрная тень.
     Наоборот светлое пятно накрывало тень целиком (оно вдвое шире) и смывало
     её ровно на последних долях секунды перед падением — а по тени и целятся.
     Тень тут механика, а свечение украшение; спорные пиксели за тенью. */
  /* Свечение — ОРЕОЛ С ПУСТОЙ СЕРЕДИНОЙ, а не сплошное пятно. Сплошное было
     вдвое шире тени и накрывало её: замер пикселей показал, что центр под
     золотой костью выходил на 17 ЯРЧЕ земли вместо 18 темнее, то есть метка
     приземления инвертировалась ровно у светящихся костей. Теперь свет лежит
     кольцом ВОКРУГ тени: и подсветка есть, и «тёмное пятно = место падения»
     работает одинаково для всех костей. */
  for(let i=0;i<bones.length;i++){
    const b=bones[i]; if(b.dead||!b.kind) continue;
    const c=GLOWCOL[b.kind]; if(!c) continue;
    const q=clamp(b.y/(groundY-7),0,1); if(q<0.35) continue;
    const rx=13*BONE_S*(1.35+1.5*q), a=0.10+0.26*q*q;
    /* волшебная переливается по кругу — пятно совпадает с источником по цвету */
    const rgb=(b.kind==='magic')?magicRGB():c;
    ctx.save(); ctx.translate(b.x,groundY+3); ctx.scale(1,0.30);
    const g=ctx.createRadialGradient(0,0,rx*0.42,0,0,rx);
    g.addColorStop(0,'rgba('+rgb+',0)');
    g.addColorStop(0.45,'rgba('+rgb+','+a.toFixed(3)+')');
    g.addColorStop(1,'rgba('+rgb+',0)');
    ctx.fillStyle=g; ctx.beginPath(); ctx.arc(0,0,rx,0,TAU); ctx.fill();
    ctx.restore();
  }
  ctx.globalAlpha=1;
  /* тень собаки сужается вместе с корпусом на развороте, но не исчезает —
     иначе пёс на миг отрывается от собственной тени */
  /* на подскоке тень остаётся на земле (так и надо), но сжимается и светлеет —
     иначе пёс висит в воздухе над своим полноразмерным чёрным пятном */
  const lf=dogLift()/(9*DOG_S||1), sh=1-0.42*lf;
  ctx.globalAlpha=0.30*(1-0.45*lf);
  ctx.fillStyle='#000';
  ctx.beginPath(); ctx.ellipse(dog.x,groundY+3,30*DOG_S*(1+0.10*dog.squash)*Math.max(0.42,Math.abs(dog.face))*sh,5.5*DOG_S*sh,0,0,TAU); ctx.fill();
  ctx.globalAlpha=1;
  ctx.fillStyle='#000';
  for(let i=0;i<bones.length;i++){
    const b=bones[i]; if(b.dead) continue;
    const q=clamp(b.y/(groundY-7),0,1); if(q<0.12) continue;   // высоко = тени всё равно не видно
    const rx=13*BONE_S*(0.35+0.75*q);
    ctx.globalAlpha=0.04+0.28*q*q;                              // число, без строки и парсинга цвета
    ctx.beginPath(); ctx.ellipse(b.x,groundY+3,rx,rx*0.30,0,0,TAU); ctx.fill();
  }
  ctx.globalAlpha=1; ctx.fillStyle='#000';   // цвет свечения наружу не отдаём
}
/* ---- ПЕРЕДНИЙ ПЛАН: трава ближе камеры. Город едет с параллаксом
   0.045–0.19, трава — 0.34: она обгоняет сцену, и двор получает глубину
   не только назад, но и вперёд. Запас ±25% ширины — под этот же сдвиг. ---- */
function buildFgGrass(){
  fgGrass=[];
  const depth=Math.max(12,PLAY_H-groundY-4);
  for(let i=0,n=Math.round(W/6);i<n;i++){
    fgGrass.push({x:rand(-W*0.25,W*1.25),y:groundY+rand(8,depth),
      h:rand(9,20),ph:rand(0,TAU),w:rand(1.6,2.8),
      col:'rgba('+(20+Math.round(rand(0,14)))+','+(34+Math.round(rand(0,16)))+','+(16+Math.round(rand(0,10)))+',0.9)'});
  }
  fgGrass.sort(function(a,b){return a.y-b.y;});   // дальние стебли рисуем первыми
}
function drawFgGrass(){
  if(!fgGrass) buildFgGrass();
  const dx=-(dog.x-W/2)*0.34;
  ctx.lineCap='round';
  for(let i=0;i<fgGrass.length;i++){
    const g=fgGrass[i], gx=g.x+dx;
    if(gx<-8||gx>W+8) continue;
    const lean=Math.sin(realTime*0.9+g.ph)*2.2;
    ctx.strokeStyle=g.col; ctx.lineWidth=g.w;
    ctx.beginPath(); ctx.moveTo(gx,g.y);
    ctx.quadraticCurveTo(gx+lean*0.4,g.y-g.h*0.6,gx+lean,g.y-g.h);
    ctx.stroke();
  }
}
/* ---------- ЗВЁЗДНОЕ НЕБО ----------
   Три слоя звёзд: пыль (мелкая, почти неподвижная), обычные и крупные
   с лучиками. Плюс млечный путь диагональной полосой и редкие падающие
   звёзды. Всё считается один раз, в кадре — только рисование точек. */
function buildStars(){
  let seed=771103;
  const rnd=()=>{ seed=(seed*1103515245+12345)&0x7fffffff; return seed/0x7fffffff; };
  stars=[];
  const skyH=groundY*0.80;                       // ниже звёзд почти не видно за городом
  for(let i=0;i<CONFIG.starCount;i++){
    const r0=rnd();
    /* 60% пыль, 30% обычные, 10% крупные */
    const tier = r0<0.60?0 : (r0<0.90?1:2);
    /* половину звёзд кучкуем вдоль млечного пути — так небо не выглядит сеткой */
    const inMilky = rnd()<0.45;
    let x,y;
    if(inMilky){
      const t=rnd();
      x = W*(-0.05+1.10*t);
      y = skyH*(0.62-0.42*t) + (rnd()-0.5)*skyH*0.20;
    }else{
      x = rnd()*W;
      y = rnd()*skyH;
    }
    stars.push({
      x:x, y:clamp(y,2,skyH),
      r: tier===0?0.7:(tier===1?1.2:1.9),
      tier: tier,
      /* голубоватые, белые и тёплые — небо становится живым */
      col: rnd()<0.25?'#bcd4ff' : (rnd()<0.5?'#fff6e2':'#ffe9c9'),
      base: tier===0?0.20:(tier===1?0.42:0.70),
      amp: tier===0?0.10:(tier===1?0.28:0.30),
      sp: 0.5+rnd()*1.6,
      ph: rnd()*6.28
    });
  }
}
function updateSky(rdt){
  if(!stars) buildStars();
  /* падающая звезда: живёт меньше секунды, летит наискось вниз */
  if(shoot){
    shoot.t+=rdt;
    shoot.x+=shoot.vx*rdt; shoot.y+=shoot.vy*rdt;
    if(shoot.t>shoot.life) shoot=null;
  }
  /* самолёт: медленный, тусклый и редкий — небо в ранней игре пустует
     минутами, но деталь не должна спорить с падающими костями */
  if(plane){
    plane.x+=plane.vx*rdt;
    if(plane.x<-40||plane.x>W+40) plane=null;
  }else{
    planeT-=rdt;
    if(planeT<=0){
      planeT=rand(26,48);
      const fromLeft=Math.random()<0.5;
      plane={x:fromLeft?-30:W+30, y:rand(groundY*0.06,groundY*0.34),
             vx:(fromLeft?1:-1)*rand(24,38), d:fromLeft?1:-1};
    }
  }
  if(!shoot){
    shootT-=rdt;
    if(shootT<=0){
      shootT=rand(CONFIG.shootMin,CONFIG.shootMax);
      const fromLeft=Math.random()<0.5;
      shoot={
        x: fromLeft?rand(-20,W*0.4):rand(W*0.6,W+20),
        y: rand(groundY*0.05,groundY*0.42),
        vx:(fromLeft?1:-1)*rand(240,420), vy:rand(90,190),
        life:rand(0.45,0.8), t:0, len:rand(26,52)
      };
    }
  }
}
function drawSky(){
  if(!stars) buildStars();
  /* млечный путь — мягкая диагональная дымка под звёздами */
  const skyH=groundY*0.80;
  ctx.save();
  ctx.translate(W*0.5,skyH*0.42); ctx.rotate(-0.42);
  if(!milkyGrad||milkyH!==skyH){
    milkyGrad=ctx.createLinearGradient(0,-skyH*0.16,0,skyH*0.16);
    milkyGrad.addColorStop(0,'rgba(150,160,235,0)');
    milkyGrad.addColorStop(0.5,'rgba(164,172,240,0.085)');
    milkyGrad.addColorStop(1,'rgba(150,160,235,0)');
    milkyH=skyH;
  }
  ctx.fillStyle=milkyGrad;
  ctx.fillRect(-W*0.9,-skyH*0.16,W*1.8,skyH*0.32);
  ctx.restore();
  /* звёзды */
  for(let i=0;i<stars.length;i++){
    const st=stars[i];
    const tw=st.base+st.amp*Math.sin(realTime*st.sp+st.ph);
    ctx.globalAlpha=clamp(tw,0,1);
    ctx.fillStyle=st.col;
    if(st.tier===0){
      ctx.fillRect(st.x,st.y,1.4,1.4);
    }else{
      ctx.beginPath(); ctx.arc(st.x,st.y,st.r,0,TAU); ctx.fill();
      if(st.tier===2){
        /* крупным — тонкие лучики крестом, они и создают «сияние» */
        ctx.globalAlpha=clamp(tw*0.55,0,1);
        ctx.strokeStyle=st.col; ctx.lineWidth=0.9;
        const L=st.r*3.4;
        ctx.beginPath();
        ctx.moveTo(st.x-L,st.y); ctx.lineTo(st.x+L,st.y);
        ctx.moveTo(st.x,st.y-L); ctx.lineTo(st.x,st.y+L);
        ctx.stroke();
      }
    }
  }
  ctx.globalAlpha=1;
  /* падающая звезда с тающим хвостом */
  if(shoot){
    const k=1-shoot.t/shoot.life;
    const n=Math.hypot(shoot.vx,shoot.vy)||1;
    const tx=shoot.x-shoot.vx/n*shoot.len, ty=shoot.y-shoot.vy/n*shoot.len;
    const tg=ctx.createLinearGradient(shoot.x,shoot.y,tx,ty);
    tg.addColorStop(0,'rgba(255,250,225,'+(0.95*k).toFixed(3)+')');
    tg.addColorStop(1,'rgba(255,250,225,0)');
    ctx.strokeStyle=tg; ctx.lineWidth=2; ctx.lineCap='round';
    ctx.beginPath(); ctx.moveTo(shoot.x,shoot.y); ctx.lineTo(tx,ty); ctx.stroke();
    ctx.fillStyle='rgba(255,252,235,'+(0.95*k).toFixed(3)+')';
    ctx.beginPath(); ctx.arc(shoot.x,shoot.y,1.8,0,TAU); ctx.fill();
  }
  if(plane){
    ctx.fillStyle='rgba(26,22,42,0.62)';
    ctx.fillRect(plane.x-4,plane.y-1.1,8,2.2);          // фюзеляж
    ctx.fillRect(plane.x-0.9,plane.y-3,1.8,6);          // крыло
    const on=Math.floor(realTime*1.7)%2===0;            // огни в противофазе
    ctx.fillStyle=on?'rgba(255,74,62,0.95)':'rgba(255,74,62,0.14)';
    ctx.beginPath(); ctx.arc(plane.x-4.4*plane.d,plane.y,1.15,0,TAU); ctx.fill();
    ctx.fillStyle=on?'rgba(186,255,206,0.16)':'rgba(186,255,206,0.95)';
    ctx.beginPath(); ctx.arc(plane.x+4.4*plane.d,plane.y,1.15,0,TAU); ctx.fill();
  }
}
/* Градиент ночного неба — один на кадр, переиспользуется и небом, и вырезом
   месяца. Пересоздаётся только при смене размера поля. */
let skyGrad=null, skyGradH=0;
let cityGlow=null, cityGlowH=0;   // тёплая засветка неба над крышами
let startVeil=null, startVeilH=0; // затемнение титула: сверху плотное, к низу сходит
let padGrad=null, padGradH=0;     // фон пульта: продолжает землю
function skyGradient(){
  if(!skyGrad||skyGradH!==PLAY_H){
    skyGrad=ctx.createLinearGradient(0,0,0,PLAY_H);
    skyGrad.addColorStop(0,'#252043'); skyGrad.addColorStop(0.55,'#3b2d52'); skyGrad.addColorStop(1,'#191325');
    skyGradH=PLAY_H;
  }
  return skyGrad;
}
/* МЕСЯЦ: тёплый серп с ореолом. Вырез закрашивается ТЕМ ЖЕ градиентом неба —
   composite-операции тут не годятся: destination-out пробивает дыру насквозь,
   а полупрозрачная кисть просто притемняет диск (наступал). */
function drawMoon(){
  const mx=W*0.80, my=PLAY_H*0.13, R=24;
  /* ореол */
  const hg=ctx.createRadialGradient(mx,my,R*0.7,mx,my,R*4.2);
  hg.addColorStop(0,'rgba(255,244,206,0.20)');
  hg.addColorStop(0.45,'rgba(240,232,200,0.07)');
  hg.addColorStop(1,'rgba(240,232,200,0)');
  ctx.fillStyle=hg;
  ctx.beginPath(); ctx.arc(mx,my,R*4.2,0,TAU); ctx.fill();
  ctx.save();
  ctx.beginPath(); ctx.arc(mx,my,R,0,TAU); ctx.clip();
  /* диск */
  ctx.fillStyle='#fdf3cd';
  ctx.beginPath(); ctx.arc(mx,my,R,0,TAU); ctx.fill();
  /* кратеры — на видимой части серпа, слева */
  ctx.fillStyle='rgba(216,202,152,0.60)';
  ctx.beginPath(); ctx.arc(mx-R*0.46,my+R*0.28,R*0.19,0,TAU); ctx.fill();
  ctx.beginPath(); ctx.arc(mx-R*0.24,my-R*0.48,R*0.12,0,TAU); ctx.fill();
  ctx.beginPath(); ctx.arc(mx-R*0.66,my-R*0.14,R*0.09,0,TAU); ctx.fill();
  /* тёплая кромка по краю диска — рисуем ДО выреза, лишнее он и съест */
  ctx.strokeStyle='rgba(255,252,228,0.75)'; ctx.lineWidth=1.8;
  ctx.beginPath(); ctx.arc(mx,my,R-0.9,0,TAU); ctx.stroke();
  /* ВЫРЕЗ: смещённый круг, закрашенный градиентом неба — шва не видно */
  ctx.fillStyle=skyGradient();
  ctx.beginPath(); ctx.arc(mx+R*0.66,my-R*0.26,R*0.92,0,TAU); ctx.fill();
  ctx.restore();
}
/* ---------- ПАРАЛЛАКС-ГОРОД ----------
   Три слоя силуэтов едут с разной скоростью от позиции собаки: дальний почти
   стоит, ближний уезжает заметно — так пустое небо превращается в глубину.
   Геометрия детерминированная (свой генератор чисел), считается один раз
   на раскладку: в кадре только заливки прямоугольников, телефон не потеет. */
function buildSkyline(){
  let seed=20260730;
  const rnd=()=>{ seed=(seed*1103515245+12345)&0x7fffffff; return seed/0x7fffffff; };
  const layers=[
    /* дальний: высокие башни, почти без окон, тонут в дымке */
    {par:0.045, col:'#241f42', top:0.52, h:[0.18,0.32], w:[26,52], gap:[2,14], win:0.10, winCol:'rgba(255,226,170,0.40)'},
    /* средний: жилые дома, окна плотнее */
    {par:0.10,  col:'#1d1834', top:0.60, h:[0.13,0.23], w:[34,64], gap:[3,12], win:0.28, winCol:'rgba(255,214,150,0.58)'},
    /* ближний: низкие крыши с трубами и антеннами */
    {par:0.19,  col:'#150f27', top:0.72, h:[0.08,0.15], w:[44,86], gap:[4,16], win:0.16, winCol:'rgba(255,205,140,0.70)'}
  ];
  sky=[];
  for(const L of layers){
    /* строим шире экрана с запасом — при сдвиге края не оголятся */
    const pad=W*0.5, blocks=[];
    let x=-pad;
    while(x<W+pad){
      const bw=L.w[0]+rnd()*(L.w[1]-L.w[0]);
      const bh=groundY*(L.h[0]+rnd()*(L.h[1]-L.h[0]));
      const b={x:x,w:bw,h:bh,wins:[],roof:[]};
      /* окна сеткой, часть погашена */
      const cols=Math.max(1,Math.floor(bw/13)), rows=Math.max(1,Math.floor(bh/17));
      for(let c=0;c<cols;c++) for(let r2=0;r2<rows;r2++){
        if(rnd()>L.win) continue;
        b.wins.push({x:6+c*13, y:12+r2*17, w:5, h:7, warm:rnd()<0.75, ph:rnd()*6.28});
      }
      /* надстройки на крыше — только у ближнего слоя */
      if(L.par>0.15){
        if(rnd()<0.55) b.roof.push({t:'box', x:bw*(0.15+rnd()*0.5), w:8+rnd()*12, h:6+rnd()*10});
        if(rnd()<0.45) b.roof.push({t:'pipe', x:bw*(0.2+rnd()*0.6), w:4, h:10+rnd()*14, smoke:rnd()<0.4, ph:rnd()*6.28});
        if(rnd()<0.30) b.roof.push({t:'ant', x:bw*(0.3+rnd()*0.4), w:2, h:14+rnd()*18});
      }
      blocks.push(b);
      x+=bw+L.gap[0]+rnd()*(L.gap[1]-L.gap[0]);
    }
    sky.push({cfg:L, blocks:blocks});
  }
  /* Один узнаваемый силуэт в дальнем слое: три слоя прямоугольников одного
     ритма читались как копипаста, взгляду не за что зацепиться. */
  sky[0].blocks.push({x:W*0.715,w:15,h:groundY*0.42,wins:[],roof:[],tower:true});
}
function drawSkyline(){
  if(!sky) buildSkyline();
  /* сдвиг от того, где собака: центр экрана = ноль */
  const off=(dog.x-W/2);
  for(const L of sky){
    const c=L.cfg, dx=-off*c.par, base=groundY*(1)+2;
    ctx.fillStyle=c.col;
    for(const b of L.blocks){
      const bx=b.x+dx;
      if(bx>W+90||bx+b.w<-90) continue;
      const by=base-b.h;
      ctx.fillRect(bx,by,b.w,b.h);
      if(b.tower){                                   // телебашня: площадка + мачта
        ctx.fillRect(bx-b.w*0.55,by+b.h*0.16,b.w*2.1,b.h*0.075);   // смотровая площадка
        ctx.fillRect(bx+b.w*0.34,by-groundY*0.085,b.w*0.32,groundY*0.085);
      }
      for(const rf of b.roof){
        if(rf.t==='ant'){ ctx.fillRect(bx+rf.x,by-rf.h,rf.w,rf.h); }
        else ctx.fillRect(bx+rf.x,by-rf.h,rf.w,rf.h);
      }
    }
    /* окна отдельным проходом: меньше переключений кисти */
    ctx.fillStyle=c.winCol;
    for(const b of L.blocks){
      const bx=b.x+dx;
      if(bx>W+90||bx+b.w<-90) continue;
      const by=base-b.h;
      for(const wn of b.wins){
        if(wn.y+wn.h>b.h-4) continue;
        /* редкое мигание: свет в квартире то есть, то нет */
        if(!wn.warm&&Math.sin(realTime*0.7+wn.ph)<0.3) continue;
        ctx.fillRect(bx+wn.x,by+wn.y,wn.w,wn.h);
      }
    }
    /* Дым из труб — только у ближнего слоя. Крыши читались как картон:
       вертикальные струйки в пустое небо над ними говорят, что в домах живут. */
    if(c.par>0.15){
      ctx.fillStyle='rgba(196,190,214,0.065)';
      for(const b of L.blocks){
        const bx=b.x+dx; if(bx>W+90||bx+b.w<-90) continue;
        const by=base-b.h;
        for(const rf of b.roof){
          if(rf.t!=='pipe'||!rf.smoke) continue;
          for(let k=0;k<3;k++){
            const t=(realTime*0.16+rf.ph+k*0.34)%1;
            ctx.beginPath();
            ctx.arc(bx+rf.x+rf.w/2+Math.sin(t*3.2+rf.ph)*6*t, by-rf.h-4-t*34, 2.4+t*7.5, 0, TAU);
            ctx.fill();
          }
        }
      }
    }
    /* дымка поверх слоя — дальние тонут сильнее.
       ГРАДИЕНТОМ, а не плоской заливкой: у плоской верхний край даёт резкую
       линию, и при вспышке молнии она проступает через весь экран. */
    const hz=groundY*c.top, hh=groundY*(1-c.top)+4;
    const hg=ctx.createLinearGradient(0,hz,0,hz+hh);
    const dens=(c.par<0.06?0.34:(c.par<0.12?0.18:0.06));
    hg.addColorStop(0,'rgba(58,45,84,0)');
    hg.addColorStop(1,'rgba(58,45,84,'+dens+')');
    ctx.fillStyle=hg;
    ctx.fillRect(0,hz,W,hh);
    /* маячок — ПОСЛЕ дымки, иначе дальний слой его гасит */
    for(const b of L.blocks){
      if(!b.tower) continue;
      const bx=b.x+dx; if(bx>W+90||bx+b.w<-90) continue;
      const ty=base-b.h-groundY*0.085;
      ctx.fillStyle='rgba(255,72,58,'+(0.28+0.72*Math.abs(Math.sin(realTime*1.5))).toFixed(2)+')';
      ctx.beginPath(); ctx.arc(bx+b.w/2,ty,2,0,TAU); ctx.fill();
    }
  }
}
/* Будки были зеркальными близнецами, и двор читался как симметричная
   декорация. Мелочи во дворе делают его обжитым и заодно дают различать
   стороны боковым зрением — это выручает, когда зеркало меняет кнопки. */
function drawYardProps(){
  ctx.save();
  /* Отступ 1.4 ширины будки: на 0.8 пропсы садились ровно на фонарь,
     который висит на карнизе в 0.62, и всё слипалось в кашу. */
  const u=Math.max(0.85,DS*1.05);
  /* Пропсы лежат на земле, а не приколочены к будкам, — значит и ехать
     должны с землёй. Иначе трава и лужи плывут, а миска стоит колом. */
  const pdx=-(dog.x-W/2)*0.10;
  const bx=kennelLX+KW*1.40+pdx, by=groundY-2;
  ctx.fillStyle='#454b55';
  ctx.beginPath(); ctx.ellipse(bx,by-3*u,11*u,4.4*u,0,0,TAU); ctx.fill();
  ctx.fillStyle='#23262c';
  ctx.beginPath(); ctx.ellipse(bx,by-4.6*u,7.6*u,2.8*u,0,0,TAU); ctx.fill();
  ctx.fillStyle='#e8ddc2';
  ctx.beginPath(); ctx.ellipse(bx+17*u,by-2*u,4.6*u,1.9*u,0.28,0,TAU); ctx.fill();
  ctx.beginPath(); ctx.arc(bx+21*u,by-2.6*u,2.1*u,0,TAU); ctx.fill();
  /* у правой — прислонённая покрышка */
  const tx=kennelRX-KW*1.40+pdx, ty=groundY-8*u+1.5;   // +1.5: слегка утоплена, иначе висит
  ctx.strokeStyle='#1e2127'; ctx.lineWidth=4.2*u;
  ctx.beginPath(); ctx.arc(tx,ty,8*u,0,TAU); ctx.stroke();
  ctx.strokeStyle='#343943'; ctx.lineWidth=1.4*u;
  ctx.beginPath(); ctx.arc(tx,ty,8*u,0,TAU); ctx.stroke();
  ctx.restore();
}
/* ---------- ПУЛЬТ: две кнопки, палец не лезет в игру ---------- */
function drawPad(){
  /* Пульт занимает пятую часть кадра и был единственным холодно-синим пятном
     в тёплой сцене — в превью стора читался как панель отладчика под
     скриншотом. Теперь верх пульта продолжает землю и уходит в тёмное. */
  if(!padGrad||padGradH!==CTRL_H){
    padGrad=ctx.createLinearGradient(0,PLAY_H,0,PLAY_H+CTRL_H);
    padGrad.addColorStop(0,'#241a13'); padGrad.addColorStop(0.45,'#141119'); padGrad.addColorStop(1,'#0a0c12');
    padGradH=CTRL_H;
  }
  ctx.fillStyle=padGrad; ctx.fillRect(0,PLAY_H,W,CTRL_H);
  ctx.fillStyle='rgba(255,220,170,0.12)'; ctx.fillRect(0,PLAY_H,W,2);
  const live=(state==='play');
  const inv=live&&invT>0;                                  // ⇄ пульт зеркальный
  const activeDir=live?((keyL!==keyR)?(keyR?1:-1):padDir):0;
  for(const s of [-1,1]){
    const r=padRect(s), pressed=(activeDir===s);
    ctx.fillStyle=inv?(pressed?'#5c3a78':'#2a1c38'):(pressed?'#3d4c6b':'#1b2130');
    rr(r.x,r.y,r.w,r.h,16); ctx.fill();
    ctx.strokeStyle=inv?(pressed?'#e2a6ff':'#7c4fa6'):(pressed?'#7d95cc':'#2b3448');
    ctx.lineWidth=inv?3:2; rr(r.x,r.y,r.w,r.h,16); ctx.stroke();
    const cx=r.x+r.w/2, cy=r.y+r.h/2, a=Math.min(r.h*0.32,28);
    /* стрелка остаётся на своей кнопке — она обозначает КНОПКУ, а не направление бега */
    ctx.fillStyle=live?(inv?(pressed?'#ffffff':'#d9b4f0'):(pressed?'#ffffff':'#93a3c4')):'#4a5468';
    ctx.beginPath();
    ctx.moveTo(cx+s*a*0.55,cy); ctx.lineTo(cx-s*a*0.45,cy-a*0.8); ctx.lineTo(cx-s*a*0.45,cy+a*0.8);
    ctx.closePath(); ctx.fill();
    if(inv) drawSwapMark(cx,r.y+13,Math.min(r.w*0.10,15));
  }
}
/* ⇄ симметричный знак «встречные стрелки»: сообщает, что управление перевёрнуто,
   и при этом НЕ подсказывает, какая кнопка куда ведёт */
function drawSwapMark(cx,cy,w){
  const blink=0.62+0.38*Math.abs(Math.sin(realTime*7));
  ctx.save(); ctx.translate(cx,cy); ctx.globalAlpha=blink;
  ctx.strokeStyle='#f0d6ff'; ctx.lineWidth=2; ctx.lineCap='round';
  const h=w*0.34;
  for(const d of [-1,1]){
    ctx.beginPath(); ctx.moveTo(-d*w,d*h); ctx.lineTo(d*w*0.72,d*h); ctx.stroke();
    ctx.fillStyle='#f0d6ff';
    ctx.beginPath();
    ctx.moveTo(d*w,d*h); ctx.lineTo(d*w*0.55,d*h-w*0.30); ctx.lineTo(d*w*0.55,d*h+w*0.30);
    ctx.closePath(); ctx.fill();
  }
  ctx.restore();
}
function drawKennel(side){
  const cx=(side===-1)?kennelLX:kennelRX;
  const hot=hotAt(side);                                   // зеркало зажигает обе
  const hm=curHotMult();
  const warn=hot&&invT<=0&&hotT<=CONFIG.hotWarn;           // предупреждение о смене
  const blinkOn=!warn||(Math.floor(realTime*12)%2===0);    // частое мигание ~6 Гц
  const sq=kennelSquash[String(side)];
  const w=KW,h=KH;
  ctx.save();
  ctx.translate(cx,groundY);
  ctx.scale(1+0.12*sq,1-0.12*sq);
  if(hot&&blinkOn){
    const pulse=0.55+0.18*Math.sin(realTime*5)+0.35*hotPunch;
    const rg=ctx.createRadialGradient(0,-h*0.45,10,0,-h*0.45,w*1.15);
    rg.addColorStop(0,'rgba(255,150,40,'+(0.34*pulse).toFixed(3)+')');
    rg.addColorStop(1,'rgba(255,150,40,0)');
    ctx.fillStyle=rg;
    ctx.beginPath(); ctx.arc(0,-h*0.45,w*1.15,0,TAU); ctx.fill();
  }
  const hotNow=hot&&blinkOn;
  ctx.fillStyle=hotNow?'#a8552d':'#6e4a31';
  rr(-w/2,-h*0.62,w,h*0.62,4); ctx.fill();
  ctx.fillStyle=hotNow?'#7c3a1e':'#4f3322';
  ctx.beginPath();
  ctx.moveTo(-w*0.62,-h*0.56); ctx.lineTo(0,-h*1.02); ctx.lineTo(w*0.62,-h*0.56);
  ctx.closePath(); ctx.fill();
  ctx.strokeStyle='rgba(0,0,0,0.18)'; ctx.lineWidth=2;
  ctx.beginPath();
  ctx.moveTo(-w/2+6,-h*0.42); ctx.lineTo(w/2-6,-h*0.42);
  ctx.moveTo(-w/2+6,-h*0.22); ctx.lineTo(w/2-6,-h*0.22);
  ctx.stroke();
  ctx.fillStyle='#211510';
  ctx.beginPath();
  ctx.arc(0,-h*0.20,w*0.22,Math.PI,0);
  ctx.lineTo(w*0.22,0); ctx.lineTo(-w*0.22,0);
  ctx.closePath(); ctx.fill();
  if(hot){
    ctx.globalAlpha=blinkOn?1:0.22;
    /* размер таблички привязан к будке — иначе на маленькой будке она выглядит вывеской.
       Чем жирнее множитель, тем ярче и крупнее — ×5 видно с другого конца двора. */
    const big=hm>=4, mid=hm>=3;
    const grow=(big?1.28:(mid?1.08:1))*(1+0.30*hotPunch);   // прыжок в момент перевыбора
    const bw=clamp(w*0.75,34,50)*grow, bh=bw*0.64, fs=bw*0.42;
    const by=-h*1.02-bh*0.75+Math.sin(realTime*(big?6:4))*(big?4.5:3);
    /* Зажимаем в поле: при ×4 на пике прыжка левый край уезжал за экран,
       а ореол вокруг таблички обрезался ВСЕГДА. */
    const bxOff=clamp(cx,bw*0.62+6,W-bw*0.62-6)-cx;
    ctx.save(); ctx.translate(bxOff,0);
    if(big){ // сияние вокруг щедрой таблички
      const gg=ctx.createRadialGradient(0,by,2,0,by,bw*1.1);
      gg.addColorStop(0,'rgba(255,225,90,0.45)'); gg.addColorStop(1,'rgba(255,225,90,0)');
      ctx.fillStyle=gg; ctx.beginPath(); ctx.arc(0,by,bw*1.1,0,TAU); ctx.fill();
    }
    ctx.fillStyle=big?'#ffd233':(mid?'#ff9f2e':'#d8823a');
    rr(-bw/2,by-bh/2,bw,bh,bh*0.31); ctx.fill();
    ctx.fillStyle=big?'#fff6cf':'#ffe3b8'; rr(-bw/2,by-bh/2,bw,bh*0.16,bh*0.09); ctx.fill();
    txt('×'+hm,0,by+fs*0.05,fs,'#3a1c00','center','bold',blinkOn?1:0.22);
    ctx.restore();
    ctx.globalAlpha=1;
  } else {
    /* Холодная будка была просто бурым домиком с дырой — в стоп-кадре не
       читалось, что это ТОЖЕ цель. Тусклая косточка над проёмом говорит
       «сюда тоже можно», не споря с яркой табличкой горячей. */
    ctx.globalAlpha=0.30;
    drawBone(0,-h*0.52,-0.22,w*0.14,false);
    ctx.globalAlpha=1;
  }
  /* фонарик на карнизе, смотрит во двор; качается, при доставке подпрыгивает
     вместе с будкой (sq). У горячей — горит и собирает мотыльков. */
  /* НАРУЖУ от будки, а не во двор. Раньше фонарь висел на внутренней стороне
     ровно там, где собака стоит при сдаче, и чёрный колпак срастался с её
     чёрным носом; поднять его не помогло — будка низкая, а собака высокая,
     на любой высоте карниза лампа попадает в голову. Единственное место,
     свободное от собаки, — внешняя стена. 0.45 ширины: дальше уедет за экран,
     будки и так стоят у самых краёв. */
  /* ТРЕТЬЯ и последняя попытка. Двигать лампу ВБОК бессмысленно: dog.x зажат
     в [26, W-26], морда достаёт ещё на 37*DOG_S, то есть собака дотягивается
     до любой точки по горизонтали — и на внутренней стене, и на внешней
     колпак садился ей на нос. Единственная свободная ось — вертикаль.
     Лампа теперь НЕ ВИСИТ, а прибита к фронтону: тело центрировано на оси
     крепления, низ на -h*0.62 против макушки собаки на -53*DOG_S ≈ -28.
     Заодно корпус тёплый, а не почти чёрный: срастаться с носом больше нечем. */
  const ax=side*w*0.34, ay=-h*0.86;
  const lit=hot&&blinkOn;
  ctx.save(); ctx.translate(ax,ay);
  ctx.rotate(Math.sin(realTime*1.8+side*1.3)*0.05+sq*0.2*Math.sin(realTime*9));
  if(lit){
    if(!lanternGrad){
      lanternGrad=ctx.createRadialGradient(0,0,1,0,0,26);
      lanternGrad.addColorStop(0,'rgba(255,214,110,0.55)'); lanternGrad.addColorStop(1,'rgba(255,214,110,0)');
    }
    ctx.fillStyle=lanternGrad; ctx.beginPath(); ctx.arc(0,0,26,0,TAU); ctx.fill();
  }
  ctx.fillStyle='#8a5a2e'; rr(-4.6,-8,9.2,2.8,1.4); ctx.fill();          // тёплый козырёк
  ctx.fillStyle=lit?'#ffd45e':'#6b5a3e'; rr(-3.6,-5.2,7.2,9.4,2.6); ctx.fill();
  if(lit){ ctx.fillStyle='#fff3c4'; ctx.beginPath(); ctx.arc(0,-0.4,2,0,TAU); ctx.fill(); }
  ctx.fillStyle='#8a5a2e'; rr(-4.6,4.4,9.2,2.4,1.2); ctx.fill();
  ctx.restore();
  if(lit){                                   // мотыльки вьются только у зажжённого
    ctx.fillStyle='rgba(240,228,190,0.85)';
    for(let mi=0;mi<3;mi++){
      const t=realTime*(1.6+mi*0.5)+mi*2.1+side*3;
      ctx.beginPath();
      ctx.arc(ax+Math.cos(t)*(10+4*Math.sin(t*2.3)),ay+Math.sin(t*1.4)*(8+3*Math.cos(t*1.9)),
              1.6+0.5*Math.sin(t*7),0,TAU);
      ctx.fill();
    }
  }
  ctx.restore();
}
function drawDog(){
  ctx.save();
  ctx.translate(dog.x,groundY-(dog.hop>0?Math.sin(Math.PI*dog.hop)*9*DOG_S:0));
  /* пол на масштабе: scale(0) схлопывает матрицу и роняет отрисовку */
  const fc=dog.face; ctx.scale(Math.abs(fc)<0.14?(fc<0?-0.14:0.14):fc,1);
  ctx.scale((1+0.14*dog.squash)*DOG_S,(1-0.14*dog.squash)*DOG_S);
  const moving=Math.abs(dog.vx)>20;
  const ph=dog.step*0.22/DOG_S;
  const stunned=stunT>0;
  /* испуг: череп падает прямо на собаку — глаз распахнут, ухо прижато */
  let scare=false, look=null, lookD=1e9;
  for(let i=0;i<bones.length;i++){ const b=bones[i]; if(b.dead) continue;
    if(b.poison&&!b.sly&&Math.abs(b.x-dog.x)<80&&b.y>groundY-300&&b.y<groundY-40) scare=true;
    if(b.y<groundY-20){                       // ближайшая кость в воздухе — за ней и следим
      const d=Math.abs(b.x-dog.x)+Math.abs(b.y-groundY)*0.35;
      if(d<lookD){ lookD=d; look=b; }
    }
  }
  /* ВЗГЛЯД: голова и зрачок ведут ближайшую кость. Раньше зрачок был прибит
     гвоздями в одну точку, и собака смотрела в пустоту мимо всего, что летит. */
  let lookUp=0, lookSide=0;
  if(look){
    lookUp=clamp((groundY-40*DOG_S-look.y)/240,0,1);
    /* по face, а не dir: это чисто экранная величина, а спрайт зеркалится
       по face. Пока знаки расходятся (первые кадры разворота), зрачок иначе
       уезжает в противоположную сторону — ровно в тот кадр, ради которого всё. */
    lookSide=clamp((look.x-dog.x)*(dog.face<0?-1:1)/130,-1,1);
  }
  const sad=(state==='over');   // партия кончилась — поза должна это говорить
  /* ТЕПЛО: собака у горящей будки ловит её свет. Раньше она подходила
     вплотную к фонарю и оставалась того же нейтрального цвета — персонаж
     жил вне освещения собственной сцены. */
  let warm=0;
  for(const sd of [-1,1]){
    if(!hotAt(sd)) continue;
    const lx=(sd===-1)?kennelLX:kennelRX, dd=Math.abs(dog.x-lx);
    if(dd<105) warm=Math.max(warm,1-dd/105);
  }
  const pal=DOGPAL[Math.min(4,Math.round(warm*4))];
  const main=pal[0], dark=pal[1], light=pal[2];
  /* НАКЛОН ВПЕРЁД по скорости и ПОКАЧИВАНИЕ в такт шагу: раньше собака бежала
     с идеально прямой спиной, и бегущую на глаз было не отличить от стоящей —
     двигались только лапы. Бег при этом главное действие игрока. */
  if(moving&&!sad) ctx.rotate(Math.min(1,Math.abs(dog.vx)/260)*0.075);
  const bob=(moving&&!sad)?-Math.abs(Math.sin(ph))*1.6:0;
  /* хвост */
  const wag=(sad||stunned)?0:Math.sin(realTime*(carrying?7:13))*0.5;   // с крестиками в глазах хвостом не виляют
  ctx.save();
  /* Хвост нарисован вектором (-13,-14) — вверх-влево. Чтобы он ПОВИС, его надо
     довернуть против часовой на ~78°, а не по часовой: +0.85 задирало его торчком. */
  ctx.translate(-25,-31+bob); ctx.rotate(sad?-1.35:(-0.5+wag*0.6));
  ctx.strokeStyle=dark; ctx.lineWidth=7; ctx.lineCap='round';
  ctx.beginPath(); ctx.moveTo(0,0); ctx.quadraticCurveTo(-8,-6,-13,-14); ctx.stroke();
  ctx.restore();
  /* дальние лапы */
  ctx.fillStyle=dark;
  let lift=moving?Math.max(0,Math.sin(ph))*5:0;
  rr(-14,-18,6,18-lift,3); ctx.fill();
  lift=moving?Math.max(0,Math.sin(ph+Math.PI))*5:0;
  rr(12,-18,6,18-lift,3); ctx.fill();
  /* тело */
  ctx.fillStyle=main;
  ctx.beginPath(); ctx.ellipse(0,-27+bob,26,15+Math.sin(realTime*3)*0.6,0,0,TAU); ctx.fill();
  ctx.fillStyle=light;
  ctx.beginPath(); ctx.ellipse(2,-20+bob,15,7,0,0,TAU); ctx.fill();
  /* ближние лапы */
  ctx.fillStyle=main;
  lift=moving?Math.max(0,Math.sin(ph+Math.PI*0.9))*5:0;
  rr(-21,-18,6,18-lift,3); ctx.fill();
  lift=moving?Math.max(0,Math.sin(ph+Math.PI*1.9))*5:0;
  rr(17,-18,6,18-lift,3); ctx.fill();
  /* голова */
  ctx.save();
  ctx.translate(22,(sad?-35:-40)+bob);   // голова опущена
  if(!sad&&!stunned) ctx.rotate(-0.18*lookUp);   // задирает морду к летящей кости
  if(stunned) ctx.rotate(0.12*Math.sin(realTime*20));
  ctx.fillStyle=main;
  ctx.beginPath(); ctx.arc(0,0,13,0,TAU); ctx.fill();
  ctx.fillStyle=light;
  ctx.beginPath(); ctx.ellipse(10,3,9,6,0,0,TAU); ctx.fill();
  ctx.fillStyle='#3a2a1e';
  ctx.beginPath(); ctx.arc(17,1,3,0,TAU); ctx.fill();
  /* ПАСТЬ. Рта не было вовсе — только точка-носа, при том что весь геймплей
     это ловля пастью, и пойманная кость просто исчезала в искрах.
     Закрытая — короткая линия; при ловле раскрывается и щёлкает. */
  if(dog.chomp>0.03&&!sad&&!stunned){
    /* Было sin(π·chomp): при chomp=1 (сам момент укуса) это ноль, то есть
       пасть в укус ЗАКРЫТА, а раскрывалась спустя 0.1с. Теперь наоборот. */
    const op=Math.min(1,dog.chomp)*9;
    ctx.fillStyle='#5a2b26';
    ctx.beginPath();
    ctx.moveTo(7.6,2.6);
    ctx.quadraticCurveTo(13,4.2+op,18.2,1.4);
    ctx.quadraticCurveTo(13,2.8,7.6,2.6);
    ctx.closePath(); ctx.fill();
    ctx.fillStyle='#ff8fa3';                       // язык внутри раскрытой пасти
    ctx.beginPath(); ctx.ellipse(12.6,3.4+op*0.45,3.1,op*0.30,0,0,TAU); ctx.fill();
  }else if(sad){
    /* Обе ветки рта были закрыты !sad, и на экране смерти морда оставалась
       голым пятном без единой линии. Грустному псу нужен свой рот — уголками вниз. */
    ctx.strokeStyle='#3a2a1e'; ctx.lineWidth=1.5; ctx.lineCap='round';
    ctx.beginPath(); ctx.moveTo(9.8,4.0); ctx.quadraticCurveTo(13.2,2.4,16.4,4.6); ctx.stroke();
  }else{
    ctx.strokeStyle='#3a2a1e'; ctx.lineWidth=1.5; ctx.lineCap='round';
    ctx.beginPath(); ctx.moveTo(9.5,4.4); ctx.quadraticCurveTo(13,6,16.4,4.2); ctx.stroke();
  }
  if(speedT>0&&!stunned){ // язык на ветру — рывок видно по морде, не только по шлейфу
    ctx.fillStyle='#ff8fa3';
    ctx.save(); ctx.translate(13,7); ctx.rotate(0.35+0.10*Math.sin(realTime*22));
    ctx.beginPath(); ctx.ellipse(2.5,4,3,6,0,0,TAU); ctx.fill();
    ctx.restore();
  }
  /* ухо */
  ctx.fillStyle=dark;
  ctx.save();
  ctx.translate(-4,-9);
  ctx.rotate((sad?1.25:(stunned?1.05:0.5+(moving?0.22:0)+(scare?0.30:0)))+Math.sin(realTime*9)*0.05);
  ctx.beginPath(); ctx.ellipse(0,6,5.5,10,0,0,TAU); ctx.fill();
  ctx.restore();
  /* глаз */
  if(stunned){
    ctx.strokeStyle='#3a2a1e'; ctx.lineWidth=2;
    ctx.beginPath();
    ctx.moveTo(2,-6); ctx.lineTo(8,0); ctx.moveTo(8,-6); ctx.lineTo(2,0);
    ctx.stroke();
  }else if(sad){
    ctx.strokeStyle='#26160c'; ctx.lineWidth=2; ctx.lineCap='round';
    ctx.beginPath(); ctx.arc(5.5,-4,3.4,0.25,Math.PI-0.25); ctx.stroke();   // закрытый, уголками вниз
  }else{
    const blink=!scare&&(realTime%3.4)<0.11;  // моргает; когда страшно — нет
    if(blink){
      ctx.strokeStyle='#26160c'; ctx.lineWidth=2; ctx.lineCap='round';
      ctx.beginPath(); ctx.moveTo(2,-3); ctx.lineTo(8.5,-3); ctx.stroke();
    }else{
      const sr=scare?4.8:3.6, pr=scare?1.3:1.8;
      ctx.fillStyle='#fff';
      ctx.beginPath(); ctx.arc(5,-3,sr,0,TAU); ctx.fill();
      /* Смещение зрачка ЗАЖАТО радиусом белка: при полном взгляде вбок-вверх
         он вылезал на шерсть и глаз читался как выбитый. */
      let ex=(scare?0.4:1.1)+1.1*lookSide, ey=(scare?-0.2:0.4)-1.5*lookUp;
      const em=Math.hypot(ex,ey), lim=sr-pr-0.25;
      if(em>lim){ ex*=lim/em; ey*=lim/em; }
      ctx.fillStyle='#26160c';
      ctx.beginPath(); ctx.arc(5+ex,-3+ey,pr,0,TAU); ctx.fill();
    }
  }
  /* кость в зубах */
  /* Кость висит НИЖЕ и мельче, чем раньше. Прежние (15,7) при r=18.4 клали её
     ровно на морду: глаз, нос и вся свежая мимика были не видны НИ РАЗУ, пока
     собака несёт кость — то есть половину игры. Теперь верх кости проходит
     под глазом, и видно взгляд, испуг, ухо и моргание. */
  /* r=16 вместо 14: при 14 кость в зубах была на 30% мельче той же кости
     секундой раньше в полёте. Больше не влезает — верх упрётся в глаз. */
  if(carrying) drawBone(18,13,-0.14,16,false,undefined);
  ctx.restore();
  ctx.restore();
  /* звёздочки оглушения */
  if(stunned){
    for(let i=0;i<3;i++){
      const a=realTime*7+i*2.09;
      drawStar(dog.x+Math.cos(a)*20*DOG_S,groundY-64*DOG_S-dogLift()+Math.sin(a)*7*DOG_S,5,'#ffd94d',a);
    }
  }
}
function drawParticles(){
  for(let i=0;i<particles.length;i++){
    const p=particles[i];
    const k=clamp(p.life/p.max,0,1);
    if(p.kind==='puff'){
      ctx.globalAlpha=k*0.7; ctx.fillStyle=p.color;
      ctx.beginPath(); ctx.arc(p.x,p.y,p.size*(1+(1-k)*1.6),0,TAU); ctx.fill();
    }else if(p.kind==='bubble'){
      ctx.globalAlpha=k*0.8; ctx.strokeStyle=p.color; ctx.lineWidth=1.5;
      ctx.beginPath(); ctx.arc(p.x,p.y,p.size,0,TAU); ctx.stroke();
    }else if(p.kind==='shard'){
      ctx.globalAlpha=k; ctx.fillStyle=p.color;
      ctx.save(); ctx.translate(p.x,p.y); ctx.rotate(p.rot||0);
      ctx.fillRect(-p.size,-p.size*0.5,p.size*2,p.size);
      ctx.restore();
    }else{ /* spark / coin / drip */
      ctx.globalAlpha=k; ctx.fillStyle=p.color;
      ctx.beginPath(); ctx.arc(p.x,p.y,p.size*(0.4+0.6*k),0,TAU); ctx.fill();
    }
  }
  ctx.globalAlpha=1;
}
function drawFloaters(){
  for(let i=0;i<floaters.length;i++){
    const f=floaters[i];
    if(f.delay>0) continue;
    const t=1-f.life/f.max;
    const sc=1+0.45*Math.max(0,1-t*3.5);
    const a=(f.life/f.max<0.35)?(f.life/f.max/0.35):1;
    /* держим надпись целиком в поле: у будки на краю она иначе срезается */
    const size=f.size*sc;
    ctx.font='bold '+size.toFixed(1)+'px system-ui,-apple-system,sans-serif';
    const halfW=ctx.measureText(f.txt).width/2+4;
    txt(f.txt,clamp(f.x,halfW,W-halfW),f.y,size,f.color,'center','bold',a);
  }
}
function drawHUD(){
  /* шкала голода — ниже чёлки на iPhone */
  const bx=36,by=12+SAFE_TOP,bw=W-28-46-22-(pauseVisible()?42:0),bh=20;
  /* Миска у торца: связь «полоса = сытость» держалась только на строчке
     в справке, которую казуальный игрок пролистнёт — и потом удивится
     экрану STARVED, не поняв, что именно у него кончилось. */
  const iy=by+bh/2;
  ctx.fillStyle='#8fe06a';
  ctx.beginPath(); ctx.ellipse(22,iy-2.5,6.5,3.2,0,0,TAU); ctx.fill();
  ctx.fillStyle='#59616d';
  ctx.beginPath(); ctx.moveTo(13.5,iy-1); ctx.lineTo(30.5,iy-1);
  ctx.lineTo(27.5,iy+6); ctx.lineTo(16.5,iy+6); ctx.closePath(); ctx.fill();
  ctx.fillStyle='#78818e';
  ctx.beginPath(); ctx.ellipse(22,iy-1,8.5,2.1,0,0,TAU); ctx.fill();
  const frac=clamp(hunger/CONFIG.hungerMax,0,1);
  ctx.fillStyle='rgba(0,0,0,0.45)'; rr(bx,by,bw,bh,10); ctx.fill();
  let a=1;
  if(frac<0.3) a=0.55+0.45*Math.abs(Math.sin(realTime*10)); // мигает при низком голоде
  const wv=Math.max(0,(bw-4)*frac);
  if(wv>1){
    ctx.globalAlpha=a;
    ctx.fillStyle='hsl('+Math.round(frac*110)+',75%,48%)';   // зелёный → жёлтый → красный
    rr(bx+2,by+2,wv,bh-4,8); ctx.fill();
    ctx.globalAlpha=1;
  }
  if(hungerFlash>0){
    ctx.globalAlpha=clamp(hungerFlash/0.6,0,1);
    ctx.strokeStyle='#ff4030'; ctx.lineWidth=3;
    rr(bx,by,bw,bh,10); ctx.stroke();
    ctx.globalAlpha=1;
  }

  /* счёт с иконкой-косточкой */
  const pk=1+0.30*scorePunch, sy=58+SAFE_TOP;
  /* На экране смерти счёт и рекорд уже написаны крупно по центру — здесь их
     повторять незачем: получалось два счёта на одном экране. */
  if(state!=='over'){
    drawBone(28,sy,-0.5,11,false);            // иконка БЕЗ пульса: раздутая налезала на цифру
    txt(String(score),52,sy,30*pk,'#ffffff','left');
    /* Показываем СЕРИЮ, а не второе число очков. Любое «+N за кость» в шапке
       спорит с числом во флотере: до переноса combo++ оно было на шаг выше,
       после — на шаг ниже. Серия — сама механика, и спорить ей не с чем. */
    if(combo>1) txt(T('streak')+combo,52,sy+24,12,'#8fe06a','left','600');
    txt(T('best')+best,W-14,sy,14,'rgba(255,255,255,0.55)','right');
  }
}

function render(){
  /* поля по краям (экран шире/выше игрового поля) */
  ctx.setTransform(DPR,0,0,DPR,0,0);
  ctx.fillStyle='#07080c'; ctx.fillRect(0,0,RW,RH);
  /* дальше рисуем в ИГРОВЫХ единицах: поле масштабируется и центрируется */
  ctx.setTransform(DPR*SCALE,0,0,DPR*SCALE,DPR*VX,DPR*VY);
  ctx.save();
  ctx.beginPath(); ctx.rect(0,0,W,H); ctx.clip(); // ничего не вылезает за поле
  /* небо */
  ctx.fillStyle=skyGradient(); ctx.fillRect(-20,-20,W+40,PLAY_H+40);   // запас под тряску
  drawSky();     // млечный путь, звёзды, падающие звёзды
  drawMoon();    // месяц с ореолом
  /* ЗАСВЕТКА: ночное небо над городом всегда подсвечено снизу. Без неё небо
     обрывалось в чёрные прямоугольники, а середина кадра оставалась пустой. */
  if(!cityGlow||cityGlowH!==groundY){
    cityGlow=ctx.createLinearGradient(0,groundY*0.50,0,groundY+4);
    cityGlow.addColorStop(0,'rgba(255,170,90,0)');
    cityGlow.addColorStop(1,'rgba(255,170,90,0.09)');
    cityGlowH=groundY;
  }
  ctx.fillStyle=cityGlow; ctx.fillRect(0,groundY*0.50,W,groundY*0.50+4);
  /* ГОРОД в три слоя */
  drawSkyline();
  /* туман у самой земли: сшивает город с площадкой */
  const fg=ctx.createLinearGradient(0,groundY-70,0,groundY+6);
  fg.addColorStop(0,'rgba(74,58,102,0)'); fg.addColorStop(1,'rgba(84,66,112,0.42)');
  ctx.fillStyle=fg; ctx.fillRect(0,groundY-70,W,76);
  /* тряска экрана */
  let ox=0,oy=0;
  if(shakeT>0){ const k=(shakeT/0.25)*shakeAmp; ox=rand(-k,k); oy=rand(-k,k); }
  ctx.save();
  ctx.translate(ox,oy);
  drawGround();
  drawYardProps();   // до фонарей: тёплое пятно должно лечь и на них
  /* фонари: тёплые пятна у каждой будки, у горячей ярче и дышит */
  for(const sd of [-1,1]){
    const lx=(sd===-1)?kennelLX:kennelRX, hot=hotAt(sd);
    /* сдал кость — будка отвечает светом: награда становится событием сцены,
       а не только текстом. Видно боковым зрением. */
    const fl=(deliverFlash>0&&sd===deliverSide)?clamp(deliverFlash/0.5,0,1):0;
    const rad=(hot?92:58)*(1+0.85*fl), pulse=hot?(1+0.06*Math.sin(realTime*3.4)):1;
    const lg=ctx.createRadialGradient(lx,groundY-KH*0.5,2,lx,groundY-KH*0.5,rad*pulse);
    lg.addColorStop(0,hot?('rgba(255,205,90,'+(0.30+0.30*fl).toFixed(2)+')')
                        :('rgba(255,225,170,'+(0.15+0.38*fl).toFixed(2)+')'));
    lg.addColorStop(1,'rgba(255,205,90,0)');
    ctx.fillStyle=lg;
    ctx.beginPath(); ctx.arc(lx,groundY-KH*0.5,rad*pulse,0,TAU); ctx.fill();
  }
  drawShadows();
  drawKennel(-1); drawKennel(1);
  for(let i=0;i<bones.length;i++){ const b=bones[i]; drawBone(b.x,b.y,b.rot,13*BONE_S,b.poison,b.kind,b.sly); }
  for(let i=0;i<fxBones.length;i++){
    const b=fxBones[i];
    if(b.mode==='arc'){
      const t=clamp(b.t/b.dur,0,1);
      drawBone(lerp(b.x0,b.x1,t),lerp(b.y0,b.y1,t)-Math.sin(Math.PI*t)*74,b.rot,11*BONE_S,false);
    }else drawBone(b.x,b.y,b.rot,12*BONE_S,false);
  }
  drawDog();
  if(vacT>0){    // 🌀 ранец-пылесос за спиной, шланг через голову к пасти
    const fd=dogFaceDir(), lift=dogLift();
    const bpx=dog.x-fd*34*DOG_S, m=mouthVis(), wob=Math.sin(realTime*10)*4*DOG_S;
    const by0=groundY-58*DOG_S-lift;
    ctx.fillStyle='#8f5fe8';
    rr(bpx-13*DOG_S,by0,26*DOG_S,34*DOG_S,8*DOG_S); ctx.fill();
    ctx.fillStyle='#b98cff';
    rr(bpx-13*DOG_S,by0,26*DOG_S,11*DOG_S,6*DOG_S); ctx.fill();
    ctx.strokeStyle='#4c2a8f'; ctx.lineWidth=2;
    rr(bpx-13*DOG_S,by0,26*DOG_S,34*DOG_S,8*DOG_S); ctx.stroke();
    ctx.strokeStyle='#4c2a8f'; ctx.lineWidth=5*DOG_S; ctx.lineCap='round';
    ctx.beginPath(); ctx.moveTo(bpx,groundY-56*DOG_S-lift);
    ctx.quadraticCurveTo(dog.x-fd*6*DOG_S,groundY-98*DOG_S-lift+wob,m.x+fd*7*DOG_S,m.y-3*DOG_S);
    ctx.stroke();
    ctx.fillStyle='#2a175c';
    ctx.beginPath(); ctx.arc(m.x+fd*9*DOG_S,m.y-3*DOG_S,5.2*DOG_S,0,TAU); ctx.fill();
    ctx.fillStyle='#b98cff';
    ctx.beginPath(); ctx.arc(m.x+fd*9*DOG_S,m.y-3*DOG_S,2.4*DOG_S,0,TAU); ctx.fill();
  }
  if(auraT>0){   // 🛡 пузырь вокруг собаки, мигает на исходе
    const fade=auraT<1.2?(0.35+0.65*Math.abs(Math.sin(realTime*14))):1;
    const R=54*DOG_S+3*Math.sin(realTime*5), cy=groundY-34*DOG_S-dogLift();
    ctx.beginPath(); ctx.arc(dog.x,cy,R,0,TAU);
    ctx.globalAlpha=0.12*fade; ctx.fillStyle='#7fd8ff'; ctx.fill();
    ctx.globalAlpha=0.55*fade; ctx.strokeStyle='#7fd8ff'; ctx.lineWidth=3; ctx.stroke();
    /* блик сверху-слева: плоское кольцо становится мыльным пузырём, и сразу
       видно, что собака ВНУТРИ защиты, а не рядом с кружком */
    ctx.globalAlpha=0.75*fade; ctx.strokeStyle='#eafaff'; ctx.lineWidth=3.5;
    ctx.beginPath(); ctx.arc(dog.x,cy,R*0.90,-2.45,-1.75); ctx.stroke();
    ctx.globalAlpha=1;
  }
  drawFgGrass();   // передний план — ПОД баннером инверсии: стебли не перечёркивают таймер
  if(invEndT>0){ // ⇄ КОНЕЦ инверсии — вспышка на весь экран, чтобы нельзя было не заметить
    const k=clamp(invEndT/CONFIG.invEndFlash,0,1);
    ctx.globalAlpha=0.72*k; ctx.fillStyle='#f6f2e6'; ctx.fillRect(0,0,W,PLAY_H);
    ctx.globalAlpha=1;
    const pop=1+0.30*k;
    txt(T('mirrorOff'),W/2,PLAY_H*0.40,Math.min(W*0.088,34)*pop,'rgba(24,20,16,'+(0.55+0.45*k)+')','center','800');
    txt(T('mirrorOffSub'),W/2,PLAY_H*0.40+32,15,'rgba(24,20,16,'+(0.45+0.4*k)+')','center','700');
  }
  if(invT>0){    // ⇄ пока идёт инверсия — жирная рамка вокруг всей сцены
    const fade=invT<1.2?(0.35+0.65*Math.abs(Math.sin(realTime*14))):1;
    ctx.globalAlpha=0.9*fade;
    ctx.strokeStyle=(Math.floor(realTime*6)%2)?'#ffffff':'#ff8a3d';
    ctx.lineWidth=7;
    ctx.strokeRect(3.5,3.5,W-7,PLAY_H-7);
    ctx.globalAlpha=1;
    /* Остаток времени — ПОЛОСОЙ. Голая цифра липла к множителю:
       «ОБЕ БУДКИ ×4   7» читалось как «×47». Полоса считывается без чтения. */
    txt(T('mirrorBanner')+CONFIG.invertHotMult,W/2,PLAY_H-30,15,'#ffffff','center','700');
    /* Полоса ВЫШЕ баннера и в СВОЁМ цвете. Раньше она лежала целиком внутри
       семипиксельной обводки рамки, тем же цветом и в той же фазе мигания —
       то есть отличалась от рамки только вторым слоем той же краски.
       Теперь: тёмная дорожка + жёлтая заливка, мигания нет вовсе. */
    const tw=Math.min(W*0.62,240), tx0=(W-tw)/2, ty0=PLAY_H-16;
    ctx.globalAlpha=0.9*fade;
    ctx.fillStyle='rgba(0,0,0,0.55)'; rr(tx0-2,ty0-2,tw+4,9,4.5); ctx.fill();
    ctx.fillStyle='#ffd94d';
    rr(tx0,ty0,tw*clamp(invT/CONFIG.invertTime,0,1),5,2.5); ctx.fill();
    ctx.globalAlpha=1;
  }
  drawParticles();
  drawFloaters();
  ctx.restore();
  drawPad(); // пульт поверх всего: сцена в него не залезает
  /* интерфейс */
  if(state==='play'||state==='over'||state==='pause') drawHUD();
  if(state==='start') drawStart();
  if(state==='help')  drawHelp();
  if(state==='pause') drawPause();
  if(state==='over')  drawOver();
  drawMute();
  drawPauseBtn();
  drawLang();
  ctx.restore(); // снимаем обрезку поля
}

/* ---------- поехали ---------- */
requestAnimationFrame(frame);

/* отладочный хук: не влияет на геймплей */
window.__dbg=function(){
  return {state:state,score:score,hunger:hunger,carrying:carrying,
    hotSide:(hotSide===-1?'L':'R'),poisonRatio:curPoisonRatio(),
    dogX:dog.x,highScore:best};
};
window.__dbg2=function(){
  return {state:state,score:score,hunger:Math.round(hunger),carrying:carrying,
    hotSide:(hotSide===-1?'L':'R'),hotMult:hotMult,hotT:+hotT.toFixed(2),stunT:+stunT.toFixed(2),
    dogX:Math.round(dog.x),groundY:Math.round(groundY),W:Math.round(W),H:Math.round(H),
    kennelLX:Math.round(kennelLX),kennelRX:Math.round(kennelRX),
    bones:bones.filter(function(b){return !b.dead;}).map(function(b){
      return {x:Math.round(b.x),y:Math.round(b.y),poison:!!b.poison,sly:!!b.sly,kind:b.kind||'norm'};}),
    speedT:+speedT.toFixed(2),slowT:+slowT.toFixed(2),auraT:+auraT.toFixed(2),vacT:+vacT.toFixed(2),invT:+invT.toFixed(2),
    drain:+curDrain().toFixed(2),best:best};
};
</script>
