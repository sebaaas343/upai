<script>
'use strict';
/* ============================================================
   «КОСТОЧКИ» — гиперказуальный прототип (одна гипотеза):
   решение «сдать кость рядом или бежать через экран за ×3» —
   достаточно ли оно весёлое, чтобы переигрывать?
   ============================================================ */

/* ---------- КОНФИГ: все игровые настройки в одном месте ---------- */
const CONFIG = {
  /* МАСШТАБ СЦЕНЫ. На мониторе (1920px) между будками умещалось ~20 длин собаки —
     отсюда ощущение простора и «бежать далеко». В узком поле собака была великаном
     (5 длин на дистанцию), поэтому забег читался как «два шага», хотя длился те же 3с.
     Уменьшаем собаку и будки — двор снова становится большим. */
  dogScale       : 0.56, // множитель размера собаки (относительно базового масштаба сцены)
  boneScale      : 0.86, // множитель размера костей (меньше собаки не трогаем — нужна читаемость примет)
  catchRadius    : 42,   // радиус ловли в ИГРОВЫХ единицах — НЕ зависит от размера собаки
  catchBandH     : 92,   // высота зоны ловли над землёй (игровые единицы)
  /* ПУЛЬТ — две кнопки. Нажимаемая зона: ровно половина панели, без щелей
     и полей, чтобы палец, скользящий с одной кнопки на другую, никуда не
     проваливался. Держишь — бежит, отпустил — стоит (как на клавиатуре). */
  ctrlFrac       : 0.17, // доля высоты поля под пульт
  ctrlMin        : 118,  // но не меньше (игровые единицы) — под большой палец
  ctrlMax        : 165,  // и не больше
  dogSpeedEmpty  : 1.25, // скорость собаки БЕЗ кости (ширин экрана в секунду)
  dogSpeedCarry  : 0.32, // скорость собаки С костью (~2.5 сек от будки до будки)
  dogAccel       : 14,   // сглаживание движения к пальцу (больше = резче)
  boneFallSpeed  : 0.21, // скорость падения костей (высот поля в секунду)
  boneFallSpeedMax:0.24, // потолок скорости падения (растёт ЕЛЕ-ЕЛЕ, это не реакция-тест)
  fallRampTime   : 90,   // за сколько секунд падение доходит до потолка
  /* ПОГОДА. Дождь усиливается ВМЕСТЕ с дугой сложности — игрок чувствует
     нарастание, не глядя на цифры. Капли бледные и тонкие: небо над зоной
     костей должно остаться читаемым, шум там дороже красоты. */
  /* НОЧНОЕ НЕБО. Дождь и гроза убраны — вместо них тихая звёздная ночь.
     Звёзды считаются один раз на раскладку, в кадре только точки. */
  starCount      : 150,  // сколько звёзд всего (три слоя по яркости)
  shootMin       : 7,    // падающая звезда раз в столько секунд (от)
  shootMax       : 19,   // ...до
  spawnInterval  : 1.30, // средний интервал появления костей В НАЧАЛЕ (сек)
  /* ПЛОХИЕ ДОБАВЛЯЮТСЯ СВЕРХУ, А НЕ ВМЕСТО ХОРОШИХ.
     Доля яда считается от ВСЕХ костей, поэтому раньше крещендо отнимало еду:
     съедобных было 85% на старте и 36% к 180-й секунде, поток еды падал на 41%.
     Теперь интервал вычисляется от ПОТОКА ЕДЫ: сколько бы ни развелось плохих,
     съедобных падает столько же, сколько на первой секунде. Спавн уплотняется
     ровно настолько, насколько нужно, чтобы это удержать. */
  spawnIntervalMin:0.45, // ПОЛ: ниже не уплотняем, иначе экран превращается в кашу
  spawnJitter    : 0.25, // случайный разброс интервала (сек)
  hungerMax      : 100,  // максимум шкалы голода
  /* РАЗОГРЕВ: первые drainWarmup секунд голод мягче — новичок учит кнопки.
     Вся остальная кривая просто сдвигается на эти секунды позже. */
  drainWarmup    : 15,
  hungerDrainEase: 4.5,  // стартуем отсюда и к концу разогрева выходим на hungerDrain
  hungerDrain    : 5.5,  // скорость голода после разогрева (ед/сек)
  hungerDrainMax : 7.3,  // уровень к концу разгона
  drainRampTime  : 75,   // за сколько секунд голод разгоняется до этого уровня
  drainLate      : 0.02, // после разгона голод ползёт дальше, но еле-еле
  drainCap       : 8.2, // ПОТОЛОК: прокормиться можно ТОЛЬКО регулярно бегая в горячую будку —
                         // ближняя будка одна не кормит. В этом и дилемма;
                         // ошибки (яд −13, уроненная кость, промахи) роют яму — умираешь ОТ НИХ
  hungerRefill   : 8,    // еда за доставку в обычную будку (горячая множит: 16 / 24 / 32)
  /* ВОЛШЕБНАЯ КОСТЬ: ловится на лету, мгновенно заливает сытость до максимума.
     Шанс растёт ПЛАВНО по мере голода, а не включается обрывом: раньше на 56
     единицах сытости он был ровно нулевой, а на 54 — сразу полный.
     Ноль при magicNeed и выше, magicChance при пустой шкале, линейно между. */
  magicChance    : 0.030,   // предел, когда шкала на нуле
  magicNeed      : 70,      // выше этой сытости не выпадает вовсе
  /* ТРИ ПРИКОЛА. Ловятся на лету, работают от РЕАЛЬНОГО времени и входят в игру
     ЛЕСЕНКОЙ: пылесос с 60-й (чистая награда, правил не меняет), щит с 90-й
     (защита — в гущу смертей), инверсия со 150-й (переворот правил —
     когда база выучена наизусть и кривые застыли). */
  auraChance     : 0.01, // 🛡 щит: вредная кость об тебя разбивается
  auraFrom       : 90,   // в гущу смертей (40–105с), а не после них
  auraTime       : 4.0,  // короткий: это страховка, а не режим бессмертия
  vacChance      : 0.01, // 🌀 пылесос: еда из НИЖНЕЙ половины экрана летит в пасть
  vacFrom        : 60,
  vacTime        : 8.0,
  vacPullSpeed   : 950,  // ед/сек, с какой кости летят к пасти
  /* ⇄ ЗЕРКАЛО: кнопки меняются местами — левая ведёт ВПРАВО. Что съедобно,
     не меняется: ломаются только руки. Плата за это — ОБЕ будки на всё время
     становятся ×4, и бежать можно в любую. Награда огромная, добежать трудно. */
  invertChance   : 0.01, // как у пылесоса — примерно раз за партию
  invertFrom     : 60,   // приходит вместе с пылесосом: база уже в руках
  invertTime     : 8.0,  // столько же, сколько пылесос
  invEndFlash    : 1.4,  // сколько держится вспышка «всё как обычно»
  invertHotMult  : 4,    // обе будки на время зеркала: 32 сытости за доставку
  edibleGuarantee: 2.4,  // АНТИ-ЗАСУХА: если съедобная не падала дольше этого — следующая обязана быть съедобной
  speedBoneEnabled:true, // ⚡ быстрая кость: ВЫКЛЮЧАТЕЛЬ для сравнения (false = без неё)
  speedChanceStart:0.0,  // ⚡ в начале не падает — как и мясо, приходит когда нужнее
  speedChanceMax : 0.07, // ...и вырастает к концу разгона
  speedRampTime  : 75,   // за сколько секунд рывок доходит до максимума
  speedBoostTime : 4.5,  // длительность рывка (сек, РЕАЛЬНОЕ время)
  slowStart      : 20,   // с какой секунды падают КАМЕННЫЕ кости
  slowChanceMax  : 0.12, // их доля среди «съедобных» в глубокой игре
  slowRampTime   : 75,   // за сколько секунд после slowStart доля доходит до максимума
  slowTime       : 4.0,  // длительность «тяжести» после касания камня (сек, РЕАЛЬНОЕ время)
  slowFactor     : 0.38, // множитель скорости собаки под тяжестью — камень почти останавливает
  stoneFallMult  : 1.25, // камень тяжёлый — падает заметно быстрее (честная примета)
  /* ПЛОХИЕ КОСТИ РАЗГОНЯЮТСЯ. Обычные падают с прежней скоростью — темп решений
     не меняется, игра не превращается в тест на реакцию. А вот яд и камни
     со временем летят всё быстрее: уворачиваться труднее, и сама скорость
     работает приметой — что летит быстро, то опасно. */
  /* ЕДИНАЯ ДУГА. Скорость гнили и урон яда — ОДНА кривая, прочитанная в
     разные стороны: чем быстрее летит гниль, тем дешевле стоит ошибка.
     Обе едут от старта партии и приходят к пределам за arcTime секунд.
     ПРЕДЕЛ СКОРОСТИ посчитан, а не выбран: собаке С КОСТЬЮ в зубах нужно
     0.61с, чтобы уйти в сторону на ширину ловли (она вчетверо медленнее
     пустой). При ×2.6 кость летит 1.29с — вдвое больше, чем нужно на уворот,
     остаётся ~0.7с на то, чтобы разглядеть и решить. Выше ×3 это уже
     проверка рефлекса, а не решение. */
  arcTime        : 150,  // за сколько секунд дуга проходится целиком
  badFallStart   : 1.0,  // множитель скорости плохих костей в начале
  badFallMax     : 2.6,  // ...и предел дуги
  badFallLateDiv : 3,    // после дуги скорость ползёт дальше втрое медленнее — без потолка,
                         // чтобы партия обязана была когда-нибудь кончиться
  poisonStart    : 0.15, // доля ядовитых костей в начале
  poisonMax      : 0.44, // доля ядовитых к концу первого разгона
  poisonRampTime : 60,   // за сколько секунд яд доходит до poisonMax
  poisonLateMax  : 0.56, // крещендо: к чему яд ползёт дальше в глубокой игре
  poisonLateRamp : 120,  // за сколько секунд после первого разгона доползает
  sneakStart     : 12,   // с какой секунды появляются ТУХЛЫЕ кости (слабый яд, своя примета — муха)
  sneakMax       : 0.55, // их доля среди ядовитых в глубокой игре
  sneakRampTime  : 70,   // за сколько секунд доля доходит до максимума
  stunTime       : 0.6,  // оглушение от яда (сек, РЕАЛЬНОЕ время)
  /* Урон едет по той же дуге, но ВНИЗ. ПОЛ 8 = ровно одна доставка в обычную
     будку (явный яд бьёт вдвое, значит 16 — одна доставка в горячую ×2).
     Ниже опускать нельзя: яд перестанет быть причиной проигрыша. */
  poisonHungerHit: 16.5, // сколько яд отнимает сытости в начале партии
  poisonHitFloor : 8,    // ...и к чему спускается за arcTime
  obviousHitMult : 2,    // ЯВНЫЙ яд (череп, зелень) бьёт вдвое: его видно за версту — влететь в него грубая ошибка
  hotPeriod      : 8.0,  // период перевыбора горячей будки (сек)
  /* ПОСЛЕ hotLateFrom окно сжимается: успеть добежать всё труднее.
     Ниже hotPeriodMin не опускаем — забег с костью занимает ~3с,
     при более коротком окне горячая будка стала бы недостижимой в принципе. */
  hotLateFrom    : 120,
  hotPeriodMin   : 4.0,
  hotLateRamp    : 120,  // окно доходит до 4с к 240-й
  hotWarn        : 1.0,  // за сколько секунд до смены будка мигает
  /* Сторона выбирается СЛУЧАЙНО: раньше она всегда перекидывалась напротив,
     и это читалось наперёд. Теперь иногда остаётся — но множитель всё равно
     перевыбирается, так что «осталась» тоже событие. */
  hotStayChance  : 0.35, // шанс, что горячей останется та же будка
  /* ярлык на будке = настоящий множитель еды: 8 / 16 / 24 / 32.
     ×2 чаще всех, ×3 реже, ×4 редкая удача. Среднее 2.51 → 20 еды за горячую доставку. */
  hotMults       : [2,3,4],
  hotMultChances : [0.58,0.33,0.09],
  /* ПОСЛЕ hotChancesFrom веса плывут к hotChancesLate: щедрые иксы становятся
     обычным делом ровно тогда, когда окно сжалось и добежать труднее. */
  hotChancesLate : [0.30,0.55,0.15],
  hotChancesFrom : 120,
  hotChancesRamp : 120,  // 120-я → 240-я: дозревает в партиях, которые реально бывают
  /* минимальный зазор по горизонтали между хорошей и плохой костью,
     пока обе в верхней части экрана: уворот должен быть возможен */
  minSepX        : 108,
  sepBandFrac    : 0.55,
  /* ДИЛЕММА КАЖДОЙ КОСТИ: съесть или сохранить.
     Обычная будка — пёс ПРЯЧЕТ кость в запас: очко, но еды мало.
     Горячая — пёс её СЪЕДАЕТ: сытно (×2…×5), но очка нет.
     Перекос в очки — умрёшь, перекос в еду — не наберёшь счёт. */
  /* ДИЛЕММА ЧЕРЕЗ ОПАСНОСТЬ, а не через очки: кость везде стоит одинаково,
     но за едой надо БЕЖАТЬ ЧЕРЕЗ ЯДОВИТЫЙ ДОЖДЬ. Замер трёх стратегий:
     только в горячую — 40 очков и смерть на 18-й секунде;
     только в ближнюю — 160 и смерть на 36-й; смесь — 210 и выжила. */
  pointsCold     : 10,   // очки за любую доставленную кость
  /* СЕРИЯ ЧИСТЫХ ДОСТАВОК: каждая доставка без полученного удара делает
     следующую дороже на comboStep, до потолка comboMax. Яд и камень сбрасывают.
     Очки перестают быть «время × 5»: чистая партия почти вдвое дороже грязной. */
  comboStep      : 2,
  comboMax       : 20,
  pointsHot      : 10    // ...в горячей столько же, но там ещё и кормят ×hotMult
};

/* ---------- утилиты ---------- */
const TAU=Math.PI*2;
const clamp=(v,a,b)=>v<a?a:(v>b?b:v);
const lerp=(a,b,t)=>a+(b-a)*t;
const rand=(a,b)=>a+Math.random()*(b-a);

/* ---------- localStorage: безопасно, с префиксом ---------- */
function lsGet(k,d){ try{ const v=localStorage.getItem('kostochki_'+k); return v===null?d:v; }catch(e){ return d; } }
function lsSet(k,v){ try{ localStorage.setItem('kostochki_'+k,String(v)); }catch(e){} }

let AC=null, masterGain=null;

function ensureAudio(){
  if(!AC){
    try{
      const Ctor=window.AudioContext||window.webkitAudioContext;
      if(Ctor){
        AC=new Ctor();
        masterGain=AC.createGain();
        masterGain.gain.value=muted?0:1;
        masterGain.connect(AC.destination);
      }
    }catch(e){ AC=null; }
  }
  if(AC&&AC.state==='suspended'){ AC.resume().catch(function(){}); }
}
function setMuted(m){
  muted=m; lsSet('mute',m?'1':'0');
  if(masterGain) masterGain.gain.value=m?0:1;
  if(m){ vacHumStop(); }   // фоны не крутим впустую
}
function tone(freq,dur,type,vol,slideTo,delay){
  if(!AC||muted) return;
  try{
    const t0=AC.currentTime+(delay||0);
    const o=AC.createOscillator(), g=AC.createGain();
    o.type=type||'sine';
    o.frequency.setValueAtTime(Math.max(30,freq),t0);
    if(slideTo) o.frequency.exponentialRampToValueAtTime(Math.max(30,slideTo),t0+dur);
    g.gain.setValueAtTime(0.0001,t0);
    g.gain.exponentialRampToValueAtTime(Math.max(0.001,vol||0.2),t0+0.012);
    g.gain.exponentialRampToValueAtTime(0.0001,t0+dur);
    o.connect(g); g.connect(masterGain);
    o.start(t0); o.stop(t0+dur+0.05);
  }catch(e){}
}
function noiseBurst(dur,vol,fFreq,delay){
  if(!AC||muted) return;
  try{
    const t0=AC.currentTime+(delay||0);
    const n=Math.max(1,Math.floor(AC.sampleRate*dur));
    const buf=AC.createBuffer(1,n,AC.sampleRate);
    const d=buf.getChannelData(0);
    for(let i=0;i<n;i++) d[i]=(Math.random()*2-1)*(1-i/n);
    const src=AC.createBufferSource(); src.buffer=buf;
    const f=AC.createBiquadFilter(); f.type='lowpass'; f.frequency.value=fFreq||1200;
    const g=AC.createGain();
    g.gain.setValueAtTime(Math.max(0.001,vol||0.2),t0);
    g.gain.exponentialRampToValueAtTime(0.0001,t0+dur);
    src.connect(f); f.connect(g); g.connect(masterGain);
    src.start(t0);
  }catch(e){}
}

    ctx.fillStyle='#e8842c'; rr(r.x,r.y,r.w,r.h,14); ctx.fill();
    txt(label,r.x+r.w/2,r.y+r.h/2,24,'#ffffff');
  }
  ctx.globalAlpha=1;
}
function btnRect(){ const w=Math.min(240,W*0.62),h=56; return {x:(W-w)/2,y:PLAY_H*0.60,w:w,h:h}; }
/* Кнопки пульта. ВАЖНО: зона нажатия — ровно половина панели без щелей и полей,
   иначе палец, скользящий с кнопки на кнопку, проваливается в «мёртвую» зону
   и собака встаёт. Рисуем со скруглением внутрь, но ловим всю половину. */
function inPad(y){ return y>=PLAY_H-10; }
/* Направление по положению пальца: вся нижняя панель, левая половина / правая.
   Ни щелей, ни отступов — палец не может «провалиться» между кнопками. */
function padDirAt(x,y){ return inPad(y)?(x<W/2?-1:1):0; }
/* видимая кнопка (нажимается при этом ВСЯ половина панели, см. padDirAt).
   Снизу оставляем полосу жеста «домой» — туда палец класть нельзя. */
function padRect(side){
  const pad=8, gap=10, y=PLAY_H+pad;
  const h=Math.max(44,CTRL_H-pad*2-SAFE_BOT), w=(W-pad*2-gap)/2;
  return {x:side<0?pad:pad+w+gap, y:y, w:w, h:h};
}

function addP(p){ particles.push(p); if(particles.length>P_MAX) particles.splice(0,particles.length-P_MAX); }
/* delay — надпись ждёт своей очереди. Без него три флотера доставки
   спавнились в одну точку и ложились нечитаемой пирамидой. */
function addFloater(x,y,t,color,size,delay){ floaters.push({x:x,y:y,txt:t,color:color,size:size,life:0.9,max:0.9,delay:delay||0}); }

/* ---------- ввод: слушатели регистрируются РОВНО один раз ---------- */
/* Тапы по интерфейсу (звук, старт, «ещё раз»). Направление сюда НЕ попадает —
   оно всегда пересчитывается из живого списка касаний, см. syncTouches. */
function onTap(x,y){
  ensureAudio();
  const m=muteRect();
  if(inRect(m,x,y)){ setMuted(!muted); SFX.uiTap(); return; }
  if(pauseVisible()&&inRect(pauseRect(),x,y,6)){ (state==='play')?pauseGame():resumeGame(); return; }
  if(state==='help'){ if(inRect(helpBackRect(),x,y,10)) goHome(); return; }
  if(state==='pause'){
    if(inRect(pauseResumeRect(),x,y,8)){ resumeGame(); return; }
    if(inRect(pauseAgainRect(),x,y,8)){ startGame(); return; }
    if(inRect(pauseMenuRect(),x,y,8)){ goHome(); return; }
    return;                                   // мимо кнопок — ничего, пауза держится
  }
  if(state==='start'){
    /* Кнопки проверяем ПЕРВЫМИ и с запасом в 10 единиц: иначе промах по
       «Как играть» на пару пикселей молча запускает партию. */
    if(inRect(langRect(),x,y,10)){ setLang(lang==='ru'?'en':'ru'); SFX.uiTap(); return; }
    if(inRect(startHelpRect(),x,y,10)){ openHelp(); return; }
    startGame(); return;                      // в остальном тап где угодно = старт
  }
  if(state==='over'&&overDelay<=0){
    if(inRect(overMenuRect(),x,y,8)){ goHome(); return; }
    if(inRect(btnRect(),x,y)) startGame();
  }
}
function clearTouches(){ touchSeq.clear(); padDir=0; }

/* ============================================================
   ВВОД. На сенсоре берём ТОЛЬКО touch-события и на каждом из них
   перечитываем e.touches — полный список живых касаний. Это снимок
   правды: устаревшей записи в нём не бывает. Прошлый вариант вёл учёт
   по отдельным событиям, и если «отпускание» терялось (палец ушёл за
   рамку, система перехватила жест), направление залипало навсегда.
   ============================================================ */
/* ⚠️ РАНЬШЕ ЗДЕСЬ БЫЛ ВЫБОР ОДНОЙ ВЕТКИ: если браузер сообщал про поддержку
   касаний, мышь не слушалась ВООБЩЕ. На ноутбуках с сенсорным экраном (и на
   части обычных Windows-ноутов, где maxTouchPoints>0 без экрана) игра
   переставала реагировать на мышь целиком — не работали ни кнопки, ни старт.
   Теперь слушаем ОБА ввода одновременно: касания идут своей веткой, мышь и
   перо — своей, а pointer-события от пальцев отбрасываются, чтобы касание
   не обработалось дважды. */
const HAS_TOUCH=('ontouchstart' in window)||(navigator.maxTouchPoints>0);
if(HAS_TOUCH){
  /* СЕРДЦЕ ФИКСА: направление НЕ накапливается по событиям, а каждый раз
     пересчитывается из e.touches — полного списка живых касаний. Устаревшей
     записи там быть не может: нет пальца в списке — нет нажатия. Именно
     ручной учёт по отдельным событиям и залипал, когда «отпускание» терялось. */
  const syncTouches=function(e){
    e.preventDefault();
    const live=e.touches;
    /* 1) выкидываем из памяти порядка всё, чего уже нет на экране */
    const alive={};
    for(let i=0;i<live.length;i++) alive[live[i].identifier]=1;
    for(const id of Array.from(touchSeq.keys())) if(!alive[id]) touchSeq.delete(id);
    /* 2) заново собираем направление; побеждает палец, нажатый ПОСЛЕДНИМ */
    let bestSeq=-1, dir=0;
    for(let i=0;i<live.length;i++){
      const t=live[i];
      const d=padDirAt(toGameX(t.clientX),toGameY(t.clientY));
      if(d===0) continue;
      if(!touchSeq.has(t.identifier)) touchSeq.set(t.identifier,++seqCounter);
      const s=touchSeq.get(t.identifier);
      if(s>bestSeq){ bestSeq=s; dir=d; }
    }
    padDir=dir; // список пуст → 0, гарантированная остановка
  };
  canvas.addEventListener('touchstart',function(e){
    for(let i=0;i<e.changedTouches.length;i++){
      const t=e.changedTouches[i];
      onTap(toGameX(t.clientX),toGameY(t.clientY));
    }
    syncTouches(e);
  },{passive:false});
  canvas.addEventListener('touchmove',syncTouches,{passive:false});
  canvas.addEventListener('touchend',syncTouches,{passive:false});
  canvas.addEventListener('touchcancel',syncTouches,{passive:false});
}
/* МЫШЬ И ПЕРО — работают ВСЕГДА, параллельно с касаниями.
   Направление живёт, только пока зажата кнопка. */
{
  let mouseDown=false;
  const fromTouch=function(e){ return e.pointerType==='touch'; };  // палец уже обработан выше
  const upd=function(e){
    if(!mouseDown){ padDir=0; return; }
    padDir=padDirAt(toGameX(e.clientX),toGameY(e.clientY));
  };
  if(window.PointerEvent){
    canvas.addEventListener('pointerdown',function(e){
      if(fromTouch(e)) return;
      e.preventDefault(); mouseDown=true;
      onTap(toGameX(e.clientX),toGameY(e.clientY));
      upd(e);
    },{passive:false});
    window.addEventListener('pointermove',function(e){
      if(fromTouch(e)) return;
      if(e.buttons===0) mouseDown=false;   // кнопку отпустили мимо нас — не залипаем
      upd(e);
    },{passive:false});
    const up=function(e){ if(e&&fromTouch(e)) return; mouseDown=false; padDir=0; };
    window.addEventListener('pointerup',up,{passive:false});
    window.addEventListener('pointercancel',up,{passive:false});
    window.addEventListener('blur',function(){ mouseDown=false; padDir=0; });
  }else{
    /* очень старые браузеры без Pointer Events — обычная мышь */
    canvas.addEventListener('mousedown',function(e){
      e.preventDefault(); mouseDown=true;
      onTap(toGameX(e.clientX),toGameY(e.clientY));
      upd(e);
    },{passive:false});
    window.addEventListener('mousemove',function(e){
      if(e.buttons===0) mouseDown=false;
      upd(e);
    },{passive:false});
    const up=function(){ mouseDown=false; padDir=0; };
    window.addEventListener('mouseup',up);
    window.addEventListener('blur',up);
  }
}
window.addEventListener('contextmenu',function(e){ e.preventDefault(); });
document.addEventListener('gesturestart',function(e){ e.preventDefault(); },{passive:false});

window.addEventListener('keydown',function(e){
  const c=e.code;
  if(c==='Space'||c==='ArrowLeft'||c==='ArrowRight') e.preventDefault();
  if(e.repeat) return;
  ensureAudio();
  if(c==='ArrowLeft'||c==='KeyA'){ keyL=true; }
  else if(c==='ArrowRight'||c==='KeyD'){ keyR=true; }
  else if(c==='Space'){
    if(state==='start') startGame();
    else if(state==='help') goHome();
    else if(state==='pause') resumeGame();
    else if(state==='over'&&overDelay<=0) startGame();
  }
  else if(c==='Escape'||c==='KeyP'){
    if(state==='play') pauseGame();
    else if(state==='pause') resumeGame();
    else if(state==='help') goHome();
  }
  else if(c==='KeyH'){ if(state==='start') openHelp(); else if(state==='help') goHome(); }
  else if(c==='KeyR'){ if(state==='play'||state==='over'||state==='pause') startGame(); }
  else if(c==='KeyM'){ setMuted(!muted); }
  else if(c==='KeyL'){ if(state==='start') setLang(lang==='ru'?'en':'ru'); }
});
window.addEventListener('keyup',function(e){
  if(e.code==='ArrowLeft'||e.code==='KeyA') keyL=false;
  if(e.code==='ArrowRight'||e.code==='KeyD') keyR=false;
});
window.addEventListener('blur',function(){ keyL=false; keyR=false; clearTouches(); });
document.addEventListener('visibilitychange',function(){
  last=performance.now(); acc=0;
  /* свернул игру / позвонили — партия встаёт на паузу, а не идёт вслепую */
  if(document.hidden&&state==='play') pauseGame();
});

/* ---------- запуск / сброс / конец забега ---------- */
function resetRun(){

  carrying=false; speedT=0; slowT=0;
  auraT=0; vacT=0; invT=0; invEndT=0; combo=0; vacHumStop();
  shootT=rand(CONFIG.shootMin,CONFIG.shootMax); shoot=null;
  planeT=rand(20,40); plane=null;
  sinceEdible=0; poisonStreak=0;
  stunT=0; hitStop=0; shakeT=0; shakeAmp=0; hungerFlash=0;
  scorePunch=0; hotPunch=0;
  kennelSquash['-1']=0; kennelSquash['1']=0;
  bones.length=0; fxBones.length=0; particles.length=0; floaters.length=0;
  dog.x=W/2; dog.dir=1; dog.face=1; dog.vx=0; dog.squash=0; dog.step=0; dog.chomp=0; dog.hop=0; lastPaw=0;
  clearTouches(); keyL=false; keyR=false;

}
function startGame(){ resetRun(); state='play'; SFX.uiTap(); SFX.bark(); }
/* Пауза замораживает и таймеры приколов: щит на 4 секунды не должен
   истекать, пока игрок отвечает на звонок. Всё живое чистим на входе. */
function pauseGame(){
  if(state!=='play') return;
  state='pause'; clearTouches(); keyL=false; keyR=false;   // mouseDown живёт в своём блоке — трогать нельзя
  dog.face=dog.dir;   // доворот замер бы на полпути: вне игры step() не идёт
  vacHumStop(); SFX.uiTap();
}
function resumeGame(){ if(state!=='pause') return; state='play'; last=performance.now(); acc=0; SFX.uiTap(); }
function goHome(){ state='start'; clearTouches(); keyL=false; keyR=false; dog.face=dog.dir; vacHumStop(); SFX.uiTap(); }
function openHelp(){ state='help'; dog.face=dog.dir; SFX.uiTap(); }   // вне play доворот не идёт
function gameOver(){
  if(state!=='play') return;
  state='over';
  overDelay=0.6;               // защита от случайного тапа сквозь экран смерти
  clearTouches(); keyL=false; keyR=false; dog.face=dog.dir;
  newBest=score>best;
  if(newBest){ best=score; lsSet('best4',best); } // рекорд пишется РОВНО один раз
  shakeT=0.3; shakeAmp=5;
  vacT=0; auraT=0; invT=0; invEndT=0; vacHumStop();
  /* step() после смерти не идёт, поэтому всё это замирало на последнем игровом
     значении и спорило с грустной позой: язык наружу при рывке, крестики в
     глазах и тряска головы при оглушении, лапы застывшие посреди шага.
     Гасим здесь, одним местом, а не оговорками «если не sad» по всей отрисовке. */
  speedT=0; slowT=0; stunT=0; dog.vx=0; dog.chomp=0; dog.hop=0;   // умер сразу после доставки — иначе висит в прыжке
  SFX.gameOver();
}

/* Съедобна обычная кость, вредна ядовитая — ВСЕГДА: зеркало правил еды не трогает.
   Камень остаётся камнем, золотая и волшебная остаются хорошими. */
function isEdible(b){ return b.kind==='norm' && !b.poison; }
function isHarmful(b){ return b.kind==='norm' && b.poison; }

/* ---------- НЕПРЕРЫВНЫЕ ФОНЫ ----------
   Дождь и дрон напряжения — не разовые звуки, а живые источники: висят всё
   время игры и меняют громкость. Оба идут через masterGain, чтобы кнопка
   звука их глушила вместе со всем остальным. */
let noiseBuf=null;
function whiteLoop(){            // один буфер шума на всё, крутится по кругу
  if(!AC) return null;
  if(!noiseBuf){
    const n=Math.floor(AC.sampleRate*2);
    noiseBuf=AC.createBuffer(1,n,AC.sampleRate);
    const d=noiseBuf.getChannelData(0);
    for(let i=0;i<n;i++) d[i]=Math.random()*2-1;
  }
  const src=AC.createBufferSource();
  src.buffer=noiseBuf; src.loop=true;
  return src;
}
/* Дождя больше нет — ночь тихая. Из непрерывных фонов остался только
   гул пылесоса, он живёт своей жизнью в vacHum. */
function updateAmbience(){}
let vacHum=null;
function vacHumStart(){
  if(!AC||muted||vacHum) return;
  try{
    const g=AC.createGain(); g.gain.value=0.0001;
    const o=AC.createOscillator();  o.type='sawtooth'; o.frequency.value=92;
    const o2=AC.createOscillator(); o2.type='square';  o2.frequency.value=138;
    const f=AC.createBiquadFilter(); f.type='lowpass'; f.frequency.value=850; f.Q.value=3;
    o.connect(f); o2.connect(f); f.connect(g); g.connect(masterGain||AC.destination);
    g.gain.linearRampToValueAtTime(0.07,AC.currentTime+0.12);
    o.start(); o2.start();
    vacHum={o:o,o2:o2,g:g};
  }catch(e){ vacHum=null; }
}
function vacHumStop(){
  if(!vacHum) return;
  const v=vacHum; vacHum=null;
  try{
    v.g.gain.linearRampToValueAtTime(0.0001,AC.currentTime+0.18);
    v.o.stop(AC.currentTime+0.22); v.o2.stop(AC.currentTime+0.22);
  }catch(e){}
}
