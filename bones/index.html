<script>
'use strict';
/* ============================================================
   «КОСТОЧКИ» — гиперказуальный прототип (одна гипотеза):
   решение «сдать кость рядом или бежать через экран за ×3» —
   достаточно ли оно весёлое, чтобы переигрывать?
   ============================================================ */

/* ---------- КОНФИГ: все игровые настройки в одном месте ---------- */
const CONFIG = {
  /* МАСШТАБ СЦЕНЫ. На мониторе (1920px) между будками умещалось ~20 длин собаки —
     отсюда ощущение простора и «бежать далеко». В узком поле собака была великаном
     (5 длин на дистанцию), поэтому забег читался как «два шага», хотя длился те же 3с.
     Уменьшаем собаку и будки — двор снова становится большим. */
  dogScale       : 0.56, // множитель размера собаки (относительно базового масштаба сцены)
  boneScale      : 0.86, // множитель размера костей (меньше собаки не трогаем — нужна читаемость примет)
  catchRadius    : 42,   // радиус ловли в ИГРОВЫХ единицах — НЕ зависит от размера собаки

function resize(){
  DPR=clamp(window.devicePixelRatio||1,1,3);
  RW=Math.max(1,window.innerWidth);
  RH=Math.max(1,window.innerHeight);
  const ar=clamp(RW/RH,AR_MIN,AR_MAX);   // пропорции поля — всегда телефонные
  let bw=RW, bh=RW/ar;                    // вписываем поле в окно
  if(bh>RH){ bh=RH; bw=RH*ar; }
  VX=Math.round((RW-bw)/2); VY=Math.round((RH-bh)/2);
  W=VW; H=Math.round(VW/ar);              // игровые единицы
  SCALE=bw/W;                             // CSS-пикселей в одной игровой единице
  canvas.width=Math.round(RW*DPR);
  canvas.height=Math.round(RH*DPR);
  /* чёлка: сколько её попадает на поле, в игровых единицах */
  const probe=document.getElementById('safe');
  const safeCss=probe?clamp(probe.getBoundingClientRect().height,0,80):0;
  SAFE_TOP=Math.max(0,(safeCss-VY)/SCALE);
  /* полоса жеста «домой» внизу iPhone: касания в ней ворует система,
     поэтому кнопки поднимаем выше неё (иначе нажатие иногда не срабатывает) */
  const probeB=document.getElementById('safeb');
  const safeBCss=probeB?clamp(probeB.getBoundingClientRect().height,0,60):0;
  const belowField=Math.max(0,RH-(VY+bh));            // сколько полосы уже вне поля
  SAFE_BOT=Math.max(0,(safeBCss-belowField)/SCALE);
  CTRL_H=clamp(H*CONFIG.ctrlFrac,CONFIG.ctrlMin,CONFIG.ctrlMax); // пульт внизу
  PLAY_H=H-CTRL_H;                                               // игровое поле — только выше пульта
  groundY=PLAY_H-Math.max(40,PLAY_H*0.07);
  sky=null;                // размер сменился — геометрию города пересчитаем заново
  stars=null;              // ...и звёздное небо тоже
  fgGrass=null;            // ...и трава переднего плана
  KW=clamp(W*0.128,48,62); // будки МАЛЕНЬКИЕ и далёкие — между ними настоящая перебежка, как на мониторе
  KH=KW*0.94;
  kennelLX=KW*0.52+4;      // центр левой будки
  kennelRX=W-KW*0.52-4;    // центр правой будки
  DS=clamp(Math.min(W,H)/460,0.8,1.25); // базовый масштаб сцены
  DOG_S=DS*CONFIG.dogScale;
  BONE_S=DS*CONFIG.boneScale;
}

/* ---------- звук: WebAudio, всё синтезируется ---------- */
let AC=null, masterGain=null;
let muted = lsGet('mute','0')==='1';
function ensureAudio(){
  if(!AC){
    try{
      const Ctor=window.AudioContext||window.webkitAudioContext;
      if(Ctor){
        AC=new Ctor();
        masterGain=AC.createGain();
        masterGain.gain.value=muted?0:1;
        masterGain.connect(AC.destination);
      }
    }catch(e){ AC=null; }
  }
  if(AC&&AC.state==='suspended'){ AC.resume().catch(function(){}); }
}
function setMuted(m){
  muted=m; lsSet('mute',m?'1':'0');
  if(masterGain) masterGain.gain.value=m?0:1;
  if(m){ vacHumStop(); }   // фоны не крутим впустую
}
function tone(freq,dur,type,vol,slideTo,delay){
  if(!AC||muted) return;
  try{
    const t0=AC.currentTime+(delay||0);
    const o=AC.createOscillator(), g=AC.createGain();
    o.type=type||'sine';
    o.frequency.setValueAtTime(Math.max(30,freq),t0);
    if(slideTo) o.frequency.exponentialRampToValueAtTime(Math.max(30,slideTo),t0+dur);
    g.gain.setValueAtTime(0.0001,t0);
    g.gain.exponentialRampToValueAtTime(Math.max(0.001,vol||0.2),t0+0.012);
    g.gain.exponentialRampToValueAtTime(0.0001,t0+dur);
    o.connect(g); g.connect(masterGain);
    o.start(t0); o.stop(t0+dur+0.05);
  }catch(e){}
}
function noiseBurst(dur,vol,fFreq,delay){
  if(!AC||muted) return;
  try{
    const t0=AC.currentTime+(delay||0);
    const n=Math.max(1,Math.floor(AC.sampleRate*dur));
    const buf=AC.createBuffer(1,n,AC.sampleRate);
    const d=buf.getChannelData(0);
    for(let i=0;i<n;i++) d[i]=(Math.random()*2-1)*(1-i/n);
    const src=AC.createBufferSource(); src.buffer=buf;
    const f=AC.createBiquadFilter(); f.type='lowpass'; f.frequency.value=fFreq||1200;
    const g=AC.createGain();
    g.gain.setValueAtTime(Math.max(0.001,vol||0.2),t0);
    g.gain.exponentialRampToValueAtTime(0.0001,t0+dur);
    src.connect(f); f.connect(g); g.connect(masterGain);
    src.start(t0);
  }catch(e){}
}

function curPoisonRatio(){
  if(runTime<=CONFIG.poisonRampTime) return lerp(CONFIG.poisonStart,CONFIG.poisonMax,runTime/CONFIG.poisonRampTime);
  return lerp(CONFIG.poisonMax,CONFIG.poisonLateMax,clamp((runTime-CONFIG.poisonRampTime)/CONFIG.poisonLateRamp,0,1)); // крещендо
}
/* целевой поток еды = как на первой секунде: (1−poisonStart)/spawnInterval */
function targetEdibleRate(){ return (1-CONFIG.poisonStart)/CONFIG.spawnInterval; }
function curHotPeriod(){
  if(runTime<=CONFIG.hotLateFrom) return CONFIG.hotPeriod;
  return lerp(CONFIG.hotPeriod,CONFIG.hotPeriodMin,clamp((runTime-CONFIG.hotLateFrom)/CONFIG.hotLateRamp,0,1));
}
/* доля костей, съеденных особыми видами — они не еда, спавн их компенсирует */
function curDeliveryPts(){ return Math.min(CONFIG.pointsCold+combo*CONFIG.comboStep,CONFIG.comboMax); }
function curInvertChance(){ return runTime<CONFIG.invertFrom?0:CONFIG.invertChance; }
function curAuraChance(){ return runTime<CONFIG.auraFrom?0:CONFIG.auraChance; }
function curVacChance(){ return runTime<CONFIG.vacFrom?0:CONFIG.vacChance; }
function curMagicChance(){
  if(hunger>=CONFIG.magicNeed) return 0;
  return CONFIG.magicChance*(1-hunger/CONFIG.magicNeed);
}
function specialShare(){ return curMagicChance()+curAuraChance()+curVacChance()+curInvertChance(); }
function curSpawnInterval(){
  const edible=(1-specialShare())*(1-curPoisonRatio())*(1-curSpeedChance()-curSlowChance());
  return Math.max(CONFIG.spawnIntervalMin, edible/targetEdibleRate());
}
function curSpeedChance(){ return CONFIG.speedBoneEnabled?lerp(CONFIG.speedChanceStart,CONFIG.speedChanceMax,clamp(runTime/CONFIG.speedRampTime,0,1)):0; }
/* розыгрыш множителя по весам; среднее = 3.0, см. CONFIG */
function curHotChances(){
  const t=clamp((runTime-CONFIG.hotChancesFrom)/CONFIG.hotChancesRamp,0,1), out=[];
  for(let i=0;i<CONFIG.hotMultChances.length;i++) out.push(lerp(CONFIG.hotMultChances[i],CONFIG.hotChancesLate[i],t));
  return out;
}
function rollHotMult(){
  const w=curHotChances(), r=Math.random(); let acc=0;
  for(let i=0;i<CONFIG.hotMults.length;i++){
    acc+=w[i];
    if(r<acc) return CONFIG.hotMults[i];
  }
  return CONFIG.hotMults[CONFIG.hotMults.length-1];
}
function curSlowChance(){ return runTime<CONFIG.slowStart?0:lerp(0,CONFIG.slowChanceMax,clamp((runTime-CONFIG.slowStart)/CONFIG.slowRampTime,0,1)); }
/* положение на общей дуге: 0 в начале партии, 1 через arcTime секунд */
function arcT(){ return clamp(runTime/CONFIG.arcTime,0,1); }
function curPoisonHit(){ return lerp(CONFIG.poisonHungerHit,CONFIG.poisonHitFloor,arcT()); }
function curSneakShare(){ return runTime<CONFIG.sneakStart?0:lerp(0,CONFIG.sneakMax,clamp((runTime-CONFIG.sneakStart)/CONFIG.sneakRampTime,0,1)); }
function curDrain(){
  if(runTime<CONFIG.drainWarmup) return lerp(CONFIG.hungerDrainEase,CONFIG.hungerDrain,runTime/CONFIG.drainWarmup);
  const t=runTime-CONFIG.drainWarmup;
  if(t<=CONFIG.drainRampTime) return lerp(CONFIG.hungerDrain,CONFIG.hungerDrainMax,t/CONFIG.drainRampTime);
  return Math.min(CONFIG.drainCap,CONFIG.hungerDrainMax+CONFIG.drainLate*(t-CONFIG.drainRampTime));
}
function curFall(){ return lerp(CONFIG.boneFallSpeed,CONFIG.boneFallSpeedMax,clamp(runTime/CONFIG.fallRampTime,0,1))*H; }
/* разгон ТОЛЬКО плохих костей (яд и камни) */
function curBadFall(){
  const base=lerp(CONFIG.badFallStart,CONFIG.badFallMax,arcT());
  if(runTime<=CONFIG.arcTime) return base;
  const rate=(CONFIG.badFallMax-CONFIG.badFallStart)/CONFIG.arcTime/CONFIG.badFallLateDiv;
  return base+rate*(runTime-CONFIG.arcTime);
}
function mouthPos(){ return {x:dog.x+37*DOG_S*dog.dir, y:groundY-34*DOG_S}; }
/* ВИЗУАЛЬНОЕ направление и подъём. Спрайт зеркалится по dog.face (доворот
   0.1с), а всё навесное считалось от МГНОВЕННОГО dog.dir и от земли — поэтому
   на развороте ранец прыгал на другую сторону раньше тела, а на подскоке
   оставался внизу. Логика ловли и притяжения по-прежнему на dir (mouthPos). */

/* Кнопки пульта. ВАЖНО: зона нажатия — ровно половина панели без щелей и полей,

  const h=Math.max(44,CTRL_H-pad*2-SAFE_BOT), w=(W-pad*2-gap)/2;

/* ---------- ввод: слушатели регистрируются РОВНО один раз ---------- */
/* Тапы по интерфейсу (звук, старт, «ещё раз»). Направление сюда НЕ попадает —
   оно всегда пересчитывается из живого списка касаний, см. syncTouches. */
function onTap(x,y){
  ensureAudio();
  const m=muteRect();
  if(inRect(m,x,y)){ setMuted(!muted); SFX.uiTap(); return; }
  if(pauseVisible()&&inRect(pauseRect(),x,y,6)){ (state==='play')?pauseGame():resumeGame(); return; }
  if(state==='help'){ if(inRect(helpBackRect(),x,y,10)) goHome(); return; }
  if(state==='pause'){
    if(inRect(pauseResumeRect(),x,y,8)){ resumeGame(); return; }
    if(inRect(pauseAgainRect(),x,y,8)){ startGame(); return; }
    if(inRect(pauseMenuRect(),x,y,8)){ goHome(); return; }
    return;                                   // мимо кнопок — ничего, пауза держится
  }
  if(state==='start'){
    /* Кнопки проверяем ПЕРВЫМИ и с запасом в 10 единиц: иначе промах по
       «Как играть» на пару пикселей молча запускает партию. */
    if(inRect(langRect(),x,y,10)){ setLang(lang==='ru'?'en':'ru'); SFX.uiTap(); return; }
    if(inRect(startHelpRect(),x,y,10)){ openHelp(); return; }
    startGame(); return;                      // в остальном тап где угодно = старт
  }
  if(state==='over'&&overDelay<=0){
    if(inRect(overMenuRect(),x,y,8)){ goHome(); return; }
    if(inRect(btnRect(),x,y)) startGame();
  }
}
function clearTouches(){ touchSeq.clear(); padDir=0; }

/* ============================================================
   ВВОД. На сенсоре берём ТОЛЬКО touch-события и на каждом из них
   перечитываем e.touches — полный список живых касаний. Это снимок
   правды: устаревшей записи в нём не бывает. Прошлый вариант вёл учёт
   по отдельным событиям, и если «отпускание» терялось (палец ушёл за
   рамку, система перехватила жест), направление залипало навсегда.
   ============================================================ */
/* ⚠️ РАНЬШЕ ЗДЕСЬ БЫЛ ВЫБОР ОДНОЙ ВЕТКИ: если браузер сообщал про поддержку
   касаний, мышь не слушалась ВООБЩЕ. На ноутбуках с сенсорным экраном (и на
   части обычных Windows-ноутов, где maxTouchPoints>0 без экрана) игра
   переставала реагировать на мышь целиком — не работали ни кнопки, ни старт.
   Теперь слушаем ОБА ввода одновременно: касания идут своей веткой, мышь и
   перо — своей, а pointer-события от пальцев отбрасываются, чтобы касание
   не обработалось дважды. */
const HAS_TOUCH=('ontouchstart' in window)||(navigator.maxTouchPoints>0);
if(HAS_TOUCH){
  /* СЕРДЦЕ ФИКСА: направление НЕ накапливается по событиям, а каждый раз
     пересчитывается из e.touches — полного списка живых касаний. Устаревшей
     записи там быть не может: нет пальца в списке — нет нажатия. Именно
     ручной учёт по отдельным событиям и залипал, когда «отпускание» терялось. */
  const syncTouches=function(e){
    e.preventDefault();
    const live=e.touches;
    /* 1) выкидываем из памяти порядка всё, чего уже нет на экране */
    const alive={};
    for(let i=0;i<live.length;i++) alive[live[i].identifier]=1;
    for(const id of Array.from(touchSeq.keys())) if(!alive[id]) touchSeq.delete(id);
    /* 2) заново собираем направление; побеждает палец, нажатый ПОСЛЕДНИМ */
    let bestSeq=-1, dir=0;
    for(let i=0;i<live.length;i++){
      const t=live[i];
      const d=padDirAt(toGameX(t.clientX),toGameY(t.clientY));
      if(d===0) continue;
      if(!touchSeq.has(t.identifier)) touchSeq.set(t.identifier,++seqCounter);
      const s=touchSeq.get(t.identifier);
      if(s>bestSeq){ bestSeq=s; dir=d; }
    }
    padDir=dir; // список пуст → 0, гарантированная остановка
  };
  canvas.addEventListener('touchstart',function(e){
    for(let i=0;i<e.changedTouches.length;i++){
      const t=e.changedTouches[i];
      onTap(toGameX(t.clientX),toGameY(t.clientY));
    }
    syncTouches(e);
  },{passive:false});
  canvas.addEventListener('touchmove',syncTouches,{passive:false});
  canvas.addEventListener('touchend',syncTouches,{passive:false});
  canvas.addEventListener('touchcancel',syncTouches,{passive:false});
}
/* МЫШЬ И ПЕРО — работают ВСЕГДА, параллельно с касаниями.
   Направление живёт, только пока зажата кнопка. */
{
  let mouseDown=false;
  const fromTouch=function(e){ return e.pointerType==='touch'; };  // палец уже обработан выше
  const upd=function(e){
    if(!mouseDown){ padDir=0; return; }
    padDir=padDirAt(toGameX(e.clientX),toGameY(e.clientY));
  };
  if(window.PointerEvent){
    canvas.addEventListener('pointerdown',function(e){
      if(fromTouch(e)) return;
      e.preventDefault(); mouseDown=true;
      onTap(toGameX(e.clientX),toGameY(e.clientY));
      upd(e);
    },{passive:false});
    window.addEventListener('pointermove',function(e){
      if(fromTouch(e)) return;
      if(e.buttons===0) mouseDown=false;   // кнопку отпустили мимо нас — не залипаем
      upd(e);
    },{passive:false});
    const up=function(e){ if(e&&fromTouch(e)) return; mouseDown=false; padDir=0; };
    window.addEventListener('pointerup',up,{passive:false});
    window.addEventListener('pointercancel',up,{passive:false});
    window.addEventListener('blur',function(){ mouseDown=false; padDir=0; });
  }else{
    /* очень старые браузеры без Pointer Events — обычная мышь */
    canvas.addEventListener('mousedown',function(e){
      e.preventDefault(); mouseDown=true;
      onTap(toGameX(e.clientX),toGameY(e.clientY));
      upd(e);
    },{passive:false});
    window.addEventListener('mousemove',function(e){
      if(e.buttons===0) mouseDown=false;
      upd(e);
    },{passive:false});
    const up=function(){ mouseDown=false; padDir=0; };
    window.addEventListener('mouseup',up);
    window.addEventListener('blur',up);
  }
}

window.addEventListener('keydown',function(e){
  const c=e.code;
  if(c==='Space'||c==='ArrowLeft'||c==='ArrowRight') e.preventDefault();
  if(e.repeat) return;
  ensureAudio();
  if(c==='ArrowLeft'||c==='KeyA'){ keyL=true; }
  else if(c==='ArrowRight'||c==='KeyD'){ keyR=true; }
  else if(c==='Space'){
    if(state==='start') startGame();
    else if(state==='help') goHome();
    else if(state==='pause') resumeGame();
    else if(state==='over'&&overDelay<=0) startGame();
  }
  else if(c==='Escape'||c==='KeyP'){
    if(state==='play') pauseGame();
    else if(state==='pause') resumeGame();
    else if(state==='help') goHome();
  }
  else if(c==='KeyH'){ if(state==='start') openHelp(); else if(state==='help') goHome(); }
  else if(c==='KeyR'){ if(state==='play'||state==='over'||state==='pause') startGame(); }
  else if(c==='KeyM'){ setMuted(!muted); }
  else if(c==='KeyL'){ if(state==='start') setLang(lang==='ru'?'en':'ru'); }
});

  speedT=0; slowT=0; stunT=0; dog.vx=0; dog.chomp=0; dog.hop=0;   // умер сразу после доставки — иначе висит в прыжке

/* ---------- НЕПРЕРЫВНЫЕ ФОНЫ ----------
   Дождь и дрон напряжения — не разовые звуки, а живые источники: висят всё
   время игры и меняют громкость. Оба идут через masterGain, чтобы кнопка
   звука их глушила вместе со всем остальным. */
let noiseBuf=null;
function whiteLoop(){            // один буфер шума на всё, крутится по кругу
  if(!AC) return null;
  if(!noiseBuf){
    const n=Math.floor(AC.sampleRate*2);
    noiseBuf=AC.createBuffer(1,n,AC.sampleRate);
    const d=noiseBuf.getChannelData(0);
    for(let i=0;i<n;i++) d[i]=Math.random()*2-1;
  }
  const src=AC.createBufferSource();
  src.buffer=noiseBuf; src.loop=true;
  return src;
}
/* Дождя больше нет — ночь тихая. Из непрерывных фонов остался только
   гул пылесоса, он живёт своей жизнью в vacHum. */
function updateAmbience(){}
let vacHum=null;
function vacHumStart(){
  if(!AC||muted||vacHum) return;
  try{
    const g=AC.createGain(); g.gain.value=0.0001;
    const o=AC.createOscillator();  o.type='sawtooth'; o.frequency.value=92;
    const o2=AC.createOscillator(); o2.type='square';  o2.frequency.value=138;
    const f=AC.createBiquadFilter(); f.type='lowpass'; f.frequency.value=850; f.Q.value=3;
    o.connect(f); o2.connect(f); f.connect(g); g.connect(masterGain||AC.destination);
    g.gain.linearRampToValueAtTime(0.07,AC.currentTime+0.12);
    o.start(); o2.start();
    vacHum={o:o,o2:o2,g:g};
  }catch(e){ vacHum=null; }
}
function vacHumStop(){
  if(!vacHum) return;
  const v=vacHum; vacHum=null;
  try{
    v.g.gain.linearRampToValueAtTime(0.0001,AC.currentTime+0.18);
    v.o.stop(AC.currentTime+0.22); v.o2.stop(AC.currentTime+0.22);
  }catch(e){}
}

/* пылесос засчитывает кость как доставку в обычную будку, пасть при этом свободна */
function vacSwallow(){
  /* combo++ ПЕРВЫМ — как в deliverBone. Иначе всосанная кость даёт на шаг
     серии меньше, чем обещает шапка: тот же рассинхрон, что чинили в доставке,
     просто в соседней функции. */
  combo++;
  score+=curDeliveryPts(); delivered++;   // всосанная — тоже чистая доставка
  /* сытость как с горячей будки ×2 (16), а не как с обычной: пылесос редкий,
     пусть кормит по-настоящему */
  hunger=Math.min(CONFIG.hungerMax,hunger+CONFIG.hungerRefill*CONFIG.hotMults[0]);
  scorePunch=1; dog.squash=1; dog.chomp=1;
